<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>White Wolf Clan | Positions</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
body{background:#0a0a0f;color:#e8e8f0;min-height:100vh;overflow-x:hidden}

#app{max-width:100vw;overflow-x:hidden}

nav{background:#12121a;border-bottom:1px solid #2a2a3a;padding:12px 16px;position:sticky;top:0;z-index:100}
.navinner{max-width:100%;margin:0 auto;display:flex;justify-content:space-between;align-items:center}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px}
.brandicon{width:28px;height:28px;background:linear-gradient(135deg,#6366f1,#8b5cf6);border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:12px}
.navlinks{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;-ms-overflow-style:none}
.navlinks::-webkit-scrollbar{display:none}
.navlinks a{color:#8b8b9e;text-decoration:none;padding:8px 12px;border-radius:6px;font-size:13px;font-weight:500;white-space:nowrap}
.navlinks a:hover,.navlinks a.active{background:rgba(99,102,241,.15);color:#6366f1}

.container{padding:16px;padding-bottom:80px;max-width:100vw}

/* Page Header */
.page-header{margin-bottom:20px}
.page-title{font-size:24px;font-weight:700;margin-bottom:4px}
.page-subtitle{font-size:13px;color:#8b8b9e}

/* Position Card */
.position-card{background:#12121a;border:1px solid #2a2a3a;border-radius:20px;padding:20px;margin-bottom:16px}
.position-card:last-child{margin-bottom:0}

/* Card Header */
.card-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.card-symbol{display:flex;align-items:center;gap:12px}
.card-badge{background:linear-gradient(135deg,#6366f1,#8b5cf6);padding:8px 16px;border-radius:10px;font-weight:700;font-size:16px}
.card-meta{text-align:right}
.card-meta-label{font-size:10px;color:#64748b;text-transform:uppercase;margin-bottom:2px}
.card-meta-value{font-size:13px;color:#8b8b9e}

/* BIG Premium Display */
.premium-big{text-align:center;padding:24px 0;border-top:1px solid #2a2a3a;border-bottom:1px solid #2a2a3a;margin-bottom:20px}
.premium-big-label{font-size:11px;color:#8b8b9e;text-transform:uppercase;letter-spacing:1px;margin-bottom:8px}
.premium-big-value{font-size:48px;font-weight:800;color:#10b981;font-family:monospace;letter-spacing:-2px}
.premium-big-sub{font-size:13px;color:#64748b;margin-top:8px}

/* Buy-to-Close Section */
.btc-section{background:#0a0a0f;border-radius:12px;padding:16px;margin-bottom:20px}
.btc-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0}
.btc-row:first-child{padding-top:0}
.btc-row:last-child{padding-bottom:0}
.btc-divider{height:1px;background:#2a2a3a;margin:8px 0}
.btc-label{font-size:13px;color:#8b8b9e}
.btc-value{font-size:18px;font-weight:700;font-family:monospace}
.btc-value.positive{color:#10b981}
.btc-value.negative{color:#ef4444}

/* Profit Tracker */
.profit-tracker{margin-bottom:20px}
.profit-tracker-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.profit-tracker-label{font-size:12px;color:#8b8b9e}
.profit-tracker-value{font-size:13px;font-weight:600}
.profit-bar-bg{height:8px;background:#2a2a3a;border-radius:4px;overflow:hidden;margin-bottom:8px}
.profit-bar-fill{height:100%;border-radius:4px;transition:width 0.3s ease}
.profit-bar-fill.positive{background:linear-gradient(90deg,#10b981,#059669)}
.profit-bar-fill.negative{background:linear-gradient(90deg,#ef4444,#dc2626)}
.profit-target{font-size:11px;color:#64748b;text-align:center}

/* Compact Greeks */
.greeks-compact{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.greek-chip{background:#0a0a0f;border-radius:8px;padding:10px 6px;text-align:center}
.greek-chip-label{font-size:9px;color:#64748b;text-transform:uppercase;display:block;margin-bottom:4px}
.greek-chip-value{font-size:14px;font-weight:700;font-family:monospace}
.greek-chip-value.positive{color:#10b981}
.greek-chip-value.negative{color:#ef4444}

/* Empty State */
.empty{text-align:center;padding:60px 20px;color:#64748b;font-size:14px}
.empty-icon{font-size:48px;margin-bottom:16px}

/* Status Bar */
#statusbar{position:fixed;bottom:0;left:0;right:0;background:#12121a;border-top:1px solid #2a2a3a;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;font-size:11px;color:#64748b;z-index:100}
.status-live{color:#10b981;display:flex;align-items:center;gap:6px}
.status-live::before{content:'';width:6px;height:6px;background:#10b981;border-radius:50%;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
</style>
</head>
<body>
<div id="app">
<nav><div class="navinner">
<div class="brand"><div class="brandicon">WW</div>White Wolf</div>
<div class="navlinks">
<a href="index.html">Dashboard</a>
<a href="positions.html" class="active">Positions</a>
<a href="trades.html">Trades</a>
<a href="news.html">Intel</a>
</div>
</div></nav>

<div class="container">
<div class="page-header">
<div class="page-title">Open Positions</div>
<div class="page-subtitle">Active trades & Greeks</div>
</div>

<div id="positions-list">
<div class="empty">
<div class="empty-icon">📊</div>
Loading positions...
</div>
</div>
</div>

<div id="statusbar">
<span id="last-update">--</span>
<span class="status-live">Live</span>
</div>
</div>

<script>
function fmt(n){if(n==null||isNaN(n))return'$0';return'$'+n.toLocaleString('en-US',{minimumFractionDigits:0,maximumFractionDigits:0});}
function fmtDec(n){if(n==null||isNaN(n))return'$0.00';return '$'+n.toFixed(2);}

async function load(){
try{
const ts=Date.now();
const r=await fetch('data/fund_state.json?cb='+ts,{cache:'no-store',headers:{'Cache-Control':'no-cache'}});
if(!r.ok)throw new Error('HTTP '+r.status);
const d=await r.json();
const positions=d?.active_positions||[];
const container=document.getElementById('positions-list');

if(positions.length===0){
container.innerHTML='<div class="empty"><div class="empty-icon">📭</div>No open positions<br><span style="font-size:12px">Check back during market hours</span></div>';
}else{
let html='';
positions.forEach(p=>{
const pnl=p.realized_pnl||0;
const pnlClass=pnl>=0?'positive':'negative';
const buybackCost=p.exit_premium_total||0;
const profit50=(p.entry_premium_total||0)*0.5;

html+='<div class="position-card">';

// Header
html+='<div class="card-header">';
html+='<div class="card-symbol"><span class="card-badge">'+p.symbol+'</span></div>';
html+='<div class="card-meta"><div class="card-meta-label">Expires</div><div class="card-meta-value">'+p.expiration+'</div></div>';
html+='</div>';

// BIG Premium
html+='<div class="premium-big">';
html+='<div class="premium-big-label">Premium Collected</div>';
html+='<div class="premium-big-value">'+fmt(p.entry_premium_total||0)+'</div>';
html+='<div class="premium-big-sub">'+p.contracts+' contracts @ $'+p.strike+' strike</div>';
html+='</div>';

// Buy-to-Close
html+='<div class="btc-section">';
html+='<div class="btc-row">';
html+='<div class="btc-label">Buy-to-Close Cost</div>';
html+='<div class="btc-value">'+fmt(buybackCost)+'</div>';
html+='</div>';
html+='<div class="btc-divider"></div>';
html+='<div class="btc-row">';
html+='<div class="btc-label">Net Profit (if closed now)</div>';
html+='<div class="btc-value '+pnlClass+'">'+(pnl>=0?'+':'')+fmtDec(pnl)+'</div>';
html+='</div>';
html+='</div>';

// Progress to 50%
const profitPct=Math.min(100,Math.max(0,((p.entry_premium_total-buybackCost)/profit50)*100));
html+='<div class="profit-tracker">';
html+='<div class="profit-tracker-header">';
html+='<span class="profit-tracker-label">Progress to 50% Profit Target</span>';
html+='<span class="profit-tracker-value">'+profitPct.toFixed(0)+'%</span>';
html+='</div>';
html+='<div class="profit-bar-bg">';
html+='<div class="profit-bar-fill '+pnlClass+'" style="width:'+profitPct+'%"></div>';
html+='</div>';
html+='<div class="profit-target">Target: $'+fmt(profit50)+' (50% of premium)</div>';
html+='</div>';

// Compact Greeks - NOTE: Unified bot doesn't track greeks currently
const displayDelta = 0;
const displayTheta = 0;
const otmPct = p.notes?.includes('OTM:') ? parseInt(p.notes.match(/OTM:\s*(\d+)%/)?.[1] || '0') : 0;

html+='<div class="greeks-compact">';
html+='<div class="greek-chip"><span class="greek-chip-label">Contracts</span><span class="greek-chip-value">'+p.contracts+'</span></div>';
html+='<div class="greek-chip"><span class="greek-chip-label">Margin</span><span class="greek-chip-value">'+fmt(p.entry_margin_required||0)+'</span></div>';
html+='<div class="greek-chip"><span class="greek-chip-label">DTE</span><span class="greek-chip-value">'+Math.ceil((new Date(p.expiration)-new Date())/(1000*60*60*24))+'</span></div>';
html+='<div class="greek-chip"><span class="greek-chip-label">Status</span><span class="greek-chip-value">'+p.status+'</span></div>';
html+='</div>';

html+='</div>';
});
container.innerHTML=html;
}

document.getElementById('last-update').textContent='Updated '+new Date().toLocaleTimeString('en-US',{timeZone:'America/Chicago',hour12:false,hour:'2-digit',minute:'2-digit'})+' CST';
}catch(e){
console.error('Load error:',e);
document.getElementById('positions-list').innerHTML='<div class="empty">Error loading positions</div>';
}
}

// Auto-load on DOM ready
document.addEventListener('DOMContentLoaded',()=>{
load();
setInterval(load,10000);
});
</script>
</body>
</html>
