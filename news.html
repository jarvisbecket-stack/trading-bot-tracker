<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>White Wolf Clan | Intelligence</title>
<style>
:root {
  --bg-primary: #0a0a0f;
  --bg-secondary: #12121a;
  --bg-card: #1a1a25;
  --border: #2a2a3a;
  --text-primary: #f0f0f5;
  --text-secondary: #8b8b9e;
  --text-muted: #64748b;
  --accent: #6366f1;
  --accent-secondary: #8b5cf6;
}

* { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }

body { background: var(--bg-primary); color: var(--text-primary); min-height: 100vh; }

nav { background: rgba(18,18,26,0.95); backdrop-filter: blur(20px); border-bottom: 1px solid var(--border); padding: 12px 16px; position: sticky; top: 0; z-index: 100; }
.nav-inner { max-width: 600px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 18px; }
.brand-icon { width: 36px; height: 36px; background: linear-gradient(135deg, var(--accent), var(--accent-secondary)); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-weight: 800; }
.nav-links { display: flex; gap: 8px; }
.nav-links a { color: var(--text-secondary); text-decoration: none; padding: 8px 14px; border-radius: 8px; font-size: 14px; font-weight: 500; transition: all 0.2s; }
.nav-links a:hover, .nav-links a.active { background: rgba(99,102,241,0.15); color: var(--accent); }

.container { max-width: 600px; margin: 0 auto; padding: 20px 16px 100px; }

.page-header { margin-bottom: 24px; }
.page-title { font-size: 28px; font-weight: 800; margin-bottom: 4px; }
.page-subtitle { font-size: 14px; color: var(--text-secondary); }

/* Position Watch */
.watch-section { background: var(--bg-card); border: 1px solid var(--border); border-radius: 16px; padding: 16px; margin-bottom: 24px; }
.watch-header { font-size: 14px; font-weight: 600; color: var(--text-secondary); margin-bottom: 12px; }
.watch-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.watch-item { background: var(--bg-secondary); border-radius: 12px; padding: 14px; text-align: center; }
.watch-symbol { font-size: 14px; font-weight: 700; color: var(--accent); margin-bottom: 4px; }
.watch-price { font-size: 20px; font-weight: 800; font-family: monospace; }
.watch-strike { font-size: 11px; color: var(--text-muted); margin-top: 4px; }

/* News List */
.news-list { display: flex; flex-direction: column; gap: 12px; }
.news-item { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; padding: 16px; text-decoration: none; color: inherit; transition: all 0.2s; }
.news-item:hover { border-color: var(--accent); }
.news-header { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
.news-symbol { font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 6px; background: rgba(99,102,241,0.15); color: var(--accent); }
.news-source { font-size: 11px; color: var(--text-muted); }
.news-headline { font-size: 15px; font-weight: 600; line-height: 1.4; margin-bottom: 6px; }
.news-summary { font-size: 13px; color: var(--text-secondary); line-height: 1.5; }

/* Status Bar */
.status-bar { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(18,18,26,0.98); backdrop-filter: blur(20px); border-top: 1px solid var(--border); padding: 14px 16px; display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: var(--text-muted); z-index: 100; }
.status-live { color: #10b981; display: flex; align-items: center; gap: 8px; font-weight: 600; }
.status-live::before { content: ''; width: 8px; height: 8px; background: #10b981; border-radius: 50%; animation: pulse 2s infinite; }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.5; } }

.empty { text-align: center; padding: 60px 20px; color: var(--text-secondary); }
.empty-icon { font-size: 48px; margin-bottom: 16px; opacity: 0.5; }
</style>
</head>
<body>
<nav>
  <div class="nav-inner">
    <div class="brand"><div class="brand-icon">WW</div><span>White Wolf</span></div>
    <div class="nav-links">
      <a href="index.html">Dashboard</a>
      <a href="wave-analysis.html">Waves</a>
      <a href="news.html" class="active">Intel</a>
    </div>
  </div>
</nav>

<div class="container">
  <div class="page-header">
    <div class="page-title">Market Intelligence</div>
    <div class="page-subtitle">Position-relevant news only</div>
  </div>

  <!-- Position Watch -->
  <div class="watch-section">
    <div class="watch-header">Position Watch</div>
    <div class="watch-grid" id="watch-grid">
      <div class="empty" style="padding:20px;"><div class="empty-icon">📊</div>Loading...</div>
    </div>
  </div>

  <!-- News Feed -->
  <div class="news-list" id="news-list">
    <div class="empty"><div class="empty-icon">📰</div>Loading intelligence...</div>
  </div>
</div>

<div class="status-bar">
  <span id="last-update">--</span>
  <span class="status-live">● Live</span>
</div>

<script>
function fmt(n) { return '$' + (n || 0).toLocaleString(); }

async function loadData() {
  try {
    const ts = Date.now();
    const [fundRes, newsRes] = await Promise.all([
      fetch('data/fund_state.json?cb=' + ts, { cache: 'no-store' }),
      fetch('data/news.json?cb=' + ts, { cache: 'no-store' })
    ]);
    
    const fundData = fundRes.ok ? await fundRes.json() : null;
    const newsData = newsRes.ok ? await newsRes.json() : null;
    
    updateWatch(fundData);
    updateNews(newsData, fundData);
    
    document.getElementById('last-update').textContent = new Date().toLocaleTimeString('en-US', {
      timeZone: 'America/Chicago', hour12: false, hour: '2-digit', minute: '2-digit'
    }) + ' CST';
  } catch (e) { console.error(e); }
}

function updateWatch(data) {
  if (!data || !data.active_positions) return;
  
  let html = '';
  data.active_positions.forEach(p => {
    html += '<div class="watch-item">';
    html += '<div class="watch-symbol">' + p.symbol + '</div>';
    html += '<div class="watch-price">$' + p.strike + '</div>';
    html += '<div class="watch-strike">' + p.contracts + ' contracts</div>';
    html += '</div>';
  });
  document.getElementById('watch-grid').innerHTML = html;
}

function updateNews(newsData, fundData) {
  const container = document.getElementById('news-list');
  if (!newsData || !newsData.articles || newsData.articles.length === 0) {
    container.innerHTML = '<div class="empty"><div class="empty-icon">📰</div>No news available</div>';
    return;
  }
  
  const symbols = fundData?.active_positions?.map(p => p.symbol) || [];
  let articles = newsData.articles.filter(a => symbols.includes(a.symbol) || a.symbol === 'MARKET').slice(0, 6);
  
  let html = '';
  articles.forEach(a => {
    html += '<a href="' + (a.url || '#') + '" class="news-item" target="_blank">';
    html += '<div class="news-header">';
    html += '<span class="news-symbol">' + a.symbol + '</span>';
    html += '<span class="news-source">' + (a.source || 'News') + '</span>';
    html += '</div>';
    html += '<div class="news-headline">' + a.headline + '</div>';
    if (a.summary) html += '<div class="news-summary">' + a.summary + '</div>';
    html += '</a>';
  });
  container.innerHTML = html;
}

document.addEventListener('DOMContentLoaded', () => {
  loadData();
  setInterval(loadData, 30000);
});
</script>
</body>
</html>
