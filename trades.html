<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>White Wolf Clan | Trade History</title>
    <style>
        :root {
            --bg-primary: #0a0a0f;
            --bg-secondary: #12121a;
            --bg-card: #1a1a25;
            --text-primary: #e8e8f0;
            --text-secondary: #8b8b9e;
            --accent-success: #10b981;
            --accent-danger: #ef4444;
            --accent-purple: #6366f1;
            --border-color: #2a2a3a;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        body { background: var(--bg-primary); color: var(--text-primary); line-height: 1.6; min-height: 100vh; }
        
        /* Navigation */
        nav { background: var(--bg-secondary); border-bottom: 1px solid var(--border-color); padding: 12px 16px; position: sticky; top: 0; z-index: 100; }
        .navinner { max-width: 100%; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; }
        .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 16px; }
        .brandicon { width: 28px; height: 28px; background: linear-gradient(135deg, #6366f1, #8b5cf6); border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 12px; }
        .navlinks { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; }
        .navlinks::-webkit-scrollbar { display: none; }
        .navlinks a { color: var(--text-secondary); text-decoration: none; padding: 8px 12px; border-radius: 6px; font-size: 13px; font-weight: 500; white-space: nowrap; }
        .navlinks a:hover, .navlinks a.active { background: rgba(99,102,241,.15); color: var(--accent-purple); }
        
        .container { padding: 16px; padding-bottom: 80px; max-width: 100vw; }
        
        /* Header */
        .page-header { margin-bottom: 20px; }
        .page-title { font-size: 24px; font-weight: 700; margin-bottom: 4px; }
        .page-subtitle { font-size: 13px; color: var(--text-secondary); }
        
        /* Summary Cards */
        .summary-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 20px; }
        .summary-card { background: var(--bg-secondary); border: 1px solid var(--border-color); border-radius: 16px; padding: 16px; text-align: center; }
        .summary-value { font-size: 28px; font-weight: 800; font-family: monospace; margin-bottom: 4px; }
        .summary-value.green { color: var(--accent-success); }
        .summary-value.red { color: var(--accent-danger); }
        .summary-label { font-size: 11px; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.5px; }
        
        /* Trades Table */
        .trades-section { background: var(--bg-secondary); border: 1px solid var(--border-color); border-radius: 16px; padding: 16px; }
        .section-title { font-size: 14px; font-weight: 600; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 16px; }
        
        .trade-card { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 12px; padding: 16px; margin-bottom: 12px; }
        .trade-card:last-child { margin-bottom: 0; }
        
        .trade-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .trade-symbol { background: linear-gradient(135deg, #6366f1, #8b5cf6); padding: 6px 12px; border-radius: 8px; font-weight: 700; font-size: 14px; }
        .trade-status { font-size: 11px; padding: 4px 10px; border-radius: 12px; font-weight: 600; text-transform: uppercase; }
        .trade-status.open { background: rgba(16, 185, 129, 0.1); color: var(--accent-success); }
        .trade-status.closed { background: rgba(100, 116, 139, 0.1); color: #64748b; }
        
        .trade-details { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 12px; }
        .trade-detail { display: flex; flex-direction: column; gap: 4px; }
        .trade-detail-label { font-size: 10px; color: #64748b; text-transform: uppercase; }
        .trade-detail-value { font-size: 15px; font-weight: 600; font-family: monospace; }
        .trade-detail-value.strike { color: var(--accent-purple); }
        .trade-detail-value.premium { color: var(--accent-success); }
        
        .trade-pnl { display: flex; justify-content: space-between; align-items: center; background: var(--bg-primary); border-radius: 12px; padding: 12px 16px; }
        .trade-pnl-label { font-size: 13px; font-weight: 500; }
        .trade-pnl-value { font-size: 20px; font-weight: 800; font-family: monospace; }
        .trade-pnl-value.positive { color: var(--accent-success); }
        .trade-pnl-value.negative { color: var(--accent-danger); }
        
        /* Status Bar */
        #statusbar { position: fixed; bottom: 0; left: 0; right: 0; background: var(--bg-secondary); border-top: 1px solid var(--border-color); padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; font-size: 11px; color: #64748b; z-index: 100; }
        .status-live { color: var(--accent-success); display: flex; align-items: center; gap: 6px; }
        .status-live::before { content: ''; width: 6px; height: 6px; background: var(--accent-success); border-radius: 50%; animation: pulse 2s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        
        .empty { text-align: center; padding: 60px 20px; color: #64748b; font-size: 14px; }
        .empty-icon { font-size: 48px; margin-bottom: 16px; }
    </style>
</head>
<body>
    <nav>
        <div class="navinner">
            <div class="brand">
                <div class="brandicon">WW</div>
                White Wolf
            </div>
            <div class="navlinks">
                <a href="index.html">Dashboard</a>
                <a href="positions.html">Positions</a>
                <a href="trades.html" class="active">Trades</a>
                <a href="news.html">Intel</a>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="page-header">
            <div class="page-title">Trade History</div>
            <div class="page-subtitle">Real trades only • CST timezone</div>
        </div>

        <div class="summary-grid">
            <div class="summary-card">
                <div class="summary-value green" id="total-pnl">--</div>
                <div class="summary-label">Total P&L</div>
            </div>
            <div class="summary-card">
                <div class="summary-value" id="total-trades">--</div>
                <div class="summary-label">Total Trades</div>
            </div>
        </div>

        <div class="trades-section">
            <div class="section-title">All Trades</div>
            <div id="trades-list">
                <div class="empty">
                    <div class="empty-icon">📊</div>
                    Loading trades...
                </div>
            </div>
        </div>
    </div>

    <div id="statusbar">
        <span id="last-update">--</span>
        <span class="status-live">Live</span>
    </div>

    <script>
        function fmt(n) {
            if (n == null || isNaN(n)) return '$0';
            return '$' + n.toLocaleString('en-US', { minimumFractionDigits: 0, maximumFractionDigits: 0 });
        }
        
        function fmtDec(n) {
            if (n == null || isNaN(n)) return '$0.00';
            return '$' + n.toFixed(2);
        }

        async function loadTrades() {
            try {
                const ts = Date.now();
                const r = await fetch('data/trade_chronicle.jsonl?cb=' + ts, { cache: 'no-store', headers: { 'Cache-Control': 'no-cache' } });
                if (!r.ok) throw new Error('HTTP ' + r.status);
                
                const text = await r.text();
                const lines = text.trim().split('\n').filter(l => l.trim() && !l.startsWith('#'));
                const trades = lines.map(line => {
                    try { return JSON.parse(line); } catch (e) { return null; }
                }).filter(t => t !== null);

                // Calculate totals
                const totalTrades = trades.length;
                const totalPnl = trades.reduce((sum, t) => sum + (t.result?.pnl || 0), 0);
                
                document.getElementById('total-trades').textContent = totalTrades;
                const pnlEl = document.getElementById('total-pnl');
                pnlEl.textContent = (totalPnl >= 0 ? '+' : '') + fmtDec(totalPnl);
                pnlEl.className = 'summary-value ' + (totalPnl >= 0 ? 'green' : 'red');

                // Render trades
                const container = document.getElementById('trades-list');
                if (trades.length === 0) {
                    container.innerHTML = '<div class="empty"><div class="empty-icon">📭</div>No trades found</div>';
                    return;
                }

                let html = '';
                trades.slice().reverse().forEach(t => {
                    const isOpen = !t.exit_time;
                    const pnl = t.result?.pnl || 0;
                    const pnlClass = pnl >= 0 ? 'positive' : 'negative';
                    const time = new Date(t.timestamp).toLocaleTimeString('en-US', { 
                        timeZone: 'America/Chicago', 
                        hour: '2-digit', 
                        minute: '2-digit', 
                        hour12: false 
                    });
                    const date = new Date(t.timestamp).toLocaleDateString('en-US', { 
                        month: 'short', 
                        day: 'numeric' 
                    });
                    const pnlLabel = isOpen ? 'Unrealized P&L' : 'Realized P&L';

                    html += '<div class="trade-card">';
                    html += '<div class="trade-header">';
                    html += '<span class="trade-symbol">' + t.symbol + '</span>';
                    html += '<span class="trade-status ' + (isOpen ? 'open' : 'closed') + '">' + (isOpen ? 'OPEN' : 'CLOSED') + '</span>';
                    html += '</div>';
                    html += '<div class="trade-details">';
                    html += '<div class="trade-detail"><span class="trade-detail-label">Strike</span><span class="trade-detail-value strike">$' + t.strike + '</span></div>';
                    html += '<div class="trade-detail"><span class="trade-detail-label">Contracts</span><span class="trade-detail-value">' + t.contracts + '</span></div>';
                    html += '<div class="trade-detail"><span class="trade-detail-label">Date</span><span class="trade-detail-value">' + date + ' ' + time + '</span></div>';
                    html += '<div class="trade-detail"><span class="trade-detail-label">Premium</span><span class="trade-detail-value premium">' + fmt(t.premium) + '</span></div>';
                    html += '</div>';
                    html += '<div class="trade-pnl">';
                    html += '<span class="trade-pnl-label">' + pnlLabel + '</span>';
                    html += '<span class="trade-pnl-value ' + pnlClass + '">' + (pnl >= 0 ? '+' : '') + fmtDec(pnl) + '</span>';
                    html += '</div>';
                    html += '</div>';
                });
                
                container.innerHTML = html;
                document.getElementById('last-update').textContent = 'Updated ' + new Date().toLocaleTimeString('en-US', { 
                    timeZone: 'America/Chicago', 
                    hour12: false, 
                    hour: '2-digit', 
                    minute: '2-digit' 
                }) + ' CST';
                
            } catch (e) {
                console.error('Load error:', e);
                document.getElementById('trades-list').innerHTML = '<div class="empty">Error loading trades</div>';
            }
        }

        // Auto-load on DOM ready
        document.addEventListener('DOMContentLoaded', loadTrades);
    </script>
</body>
</html>
