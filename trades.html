<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>White Wolf Clan | Trade History</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
body{background:#0a0a0f;color:#e8e8f0;min-height:100vh}
#gate{position:fixed;inset:0;background:#0a0a0f;display:flex;align-items:center;justify-content:center;z-index:9999}
.gatebox{background:#12121a;border:1px solid #2a2a3a;border-radius:16px;padding:40px;width:90%;max-width:380px;text-align:center}
.gatelogo{width:64px;height:64px;background:linear-gradient(135deg,#6366f1,#8b5cf6);border-radius:12px;display:flex;align-items:center;justify-content:center;margin:0 auto 20px;font-size:24px;font-weight:bold}
.gatebox input{width:100%;background:#1a1a25;border:1px solid #2a2a3a;border-radius:8px;padding:12px;color:#e8e8f0;font-size:16px;text-align:center;margin:16px 0}
.gatebox button{width:100%;background:#6366f1;color:white;border:none;border-radius:8px;padding:12px;font-size:16px;font-weight:500;cursor:pointer}
.gatebox .err{color:#ef4444;margin-top:12px;font-size:14px;display:none}
#app{display:none}
nav{background:#12121a;border-bottom:1px solid #2a2a3a;padding:16px 24px}
.navinner{max-width:1200px;margin:0 auto;display:flex;justify-content:space-between;align-items:center}
.brand{display:flex;align-items:center;gap:12px;font-weight:bold;font-size:18px}
.brandicon{width:32px;height:32px;background:linear-gradient(135deg,#6366f1,#8b5cf6);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:14px}
.navlinks{display:flex;gap:8px}
.navlinks a{color:#8b8b9e;text-decoration:none;padding:8px 16px;border-radius:8px;font-size:14px}
.navlinks a:hover,.navlinks a.active{background:rgba(99,102,241,.15);color:#6366f1}
.container{max-width:1200px;margin:0 auto;padding:24px}
.header{margin-bottom:24px}
.header h1{font-size:28px;margin-bottom:4px}
.header p{color:#8b8b9e;font-size:14px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px}
.stat{background:#12121a;border:1px solid #2a2a3a;border-radius:12px;padding:20px;text-align:center}
.statvalue{font-size:32px;font-weight:bold;font-family:monospace}
.statvalue.green{color:#10b981}
.statlabel{font-size:12px;color:#8b8b9e;text-transform:uppercase;margin-top:4px}
.filters{display:flex;gap:12px;margin-bottom:20px}
.filterbtn{padding:8px 16px;border-radius:8px;border:1px solid #2a2a3a;background:#12121a;color:#8b8b9e;font-size:13px;cursor:pointer}
.filterbtn:hover,.filterbtn.active{background:rgba(99,102,241,.15);border-color:#6366f1;color:#6366f1}
.section{background:#12121a;border:1px solid #2a2a3a;border-radius:12px;padding:20px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:12px;text-align:left;border-bottom:1px solid #2a2a3a}
th{color:#8b8b9e;font-size:11px;text-transform:uppercase}
tr:hover{background:rgba(99,102,241,.05)}
.symbol{color:#6366f1;font-weight:600}
.positive{color:#10b981}
.negative{color:#ef4444}
.badge{display:inline-block;padding:4px 10px;border-radius:4px;font-size:12px;font-weight:600}
.badge-open{background:rgba(245,158,11,.15);color:#f59e0b}
.badge-closed{background:rgba(16,185,129,.15);color:#10b981}
.empty{text-align:center;padding:60px 20px;color:#8b8b9e}
#statusbar{position:fixed;bottom:0;left:0;right:0;background:#12121a;border-top:1px solid #2a2a3a;padding:12px 24px;font-size:12px;display:flex;justify-content:space-between}
.statusgood{color:#10b981}
</style>
</head>
<body>
<div id="gate">
<div class="gatebox">
<div class="gatelogo">WW</div>
<h2>White Wolf Clan</h2>
<p style="color:#8b8b9e;font-size:14px;margin:8px 0 24px">Trade History</p>
<input type="password" id="pwd" placeholder="Enter password">
<button onclick="auth()">Access</button>
<p class="err" id="err">Invalid password</p>
</div>
</div>

<div id="app">
<nav><div class="navinner">
<div class="brand"><div class="brandicon">WW</div>White Wolf Clan</div>
<div class="navlinks">
<a href="index.html">Dashboard</a>
<a href="positions.html">Positions</a>
<a href="trades.html" class="active">Trades</a>
<a href="news.html">News & Alerts</a>
<a href="calculator.html">Calculator</a>
</div>
</div></nav>

<div class="container">
<div class="header"><h1>Trade History</h1><p>All transactions • CST timezone</p></div>

<div class="stats">
<div class="stat"><div class="statvalue" id="total-trades">0</div><div class="statlabel">Total Trades</div></div>
<div class="stat"><div class="statvalue" id="win-rate">0%</div><div class="statlabel">Win Rate</div></div>
<div class="stat"><div class="statvalue green" id="total-pnl">$0</div><div class="statlabel">Total P&L</div></div>
<div class="stat"><div class="statvalue" id="avg-trade">$0</div><div class="statlabel">Avg Trade</div></div>
</div>

<div class="filters">
<button class="filterbtn active" onclick="filter('all')">All Trades</button>
<button class="filterbtn" onclick="filter('today')">Today</button>
<button class="filterbtn" onclick="filter('win')">Winners</button>
<button class="filterbtn" onclick="filter('loss')">Losers</button>
</div>

<div class="section">
<div id="trades-content"><div class="empty">Loading trades...</div></div>
</div>
</div>

<div id="statusbar">
<span id="last-update">--</span>
<span id="conn-status" class="statusgood">● Live</span>
</div>
</div>

<script>
const PWD='jarvisb';
function auth(){
const input=document.getElementById('pwd').value;
if(input===PWD){
sessionStorage.setItem('ww-auth','1');
document.getElementById('gate').style.display='none';
document.getElementById('app').style.display='block';
load();
}else{document.getElementById('err').style.display='block';}
}
document.getElementById('pwd').addEventListener('keypress',e=>{if(e.key==='Enter')auth()});
if(sessionStorage.getItem('ww-auth')==='1'){
document.getElementById('gate').style.display='none';
document.getElementById('app').style.display='block';
}

function fmt(n){if(n==null||isNaN(n))return'$0';return'$'+n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});}

let allTrades=[];
let currentFilter='all';

async function load(){
try{
document.getElementById('conn-status').textContent='● Loading...';
const r=await fetch('data/trade_chronicle.jsonl?_='+Date.now(),{cache:'no-store'});

if(!r.ok){
document.getElementById('trades-content').innerHTML='<div class="empty"><p>No trades recorded yet</p><p style="font-size:13px;margin-top:8px">Trading hours: 8:30 AM - 3:30 PM CST</p></div>';
document.getElementById('conn-status').textContent='● No data';
return;
}

const text=await r.text();
const lines=text.trim().split('\n').filter(l=>l.trim());

if(lines.length===0){
document.getElementById('trades-content').innerHTML='<div class="empty"><p>No trades recorded yet</p></div>';
return;
}

allTrades=lines.map(line=>{try{return JSON.parse(line);}catch(e){return null;}}).filter(t=>t!==null);
renderTrades();
document.getElementById('conn-status').textContent='● Live';
document.getElementById('conn-status').className='statusgood';
document.getElementById('last-update').textContent='Updated: '+new Date().toLocaleTimeString('en-US',{timeZone:'America/Chicago',hour12:false})+' CST';

}catch(e){
console.error(e);
document.getElementById('trades-content').innerHTML='<div class="empty"><p>Error loading trades</p></div>';
}
}

function renderTrades(){
let filtered=[...allTrades];

if(currentFilter==='today'){
const today=new Date().toDateString();
filtered=filtered.filter(t=>new Date(t.timestamp).toDateString()===today);
}else if(currentFilter==='win'){
filtered=filtered.filter(t=>(t.result?.pnl||0)>0);
}else if(currentFilter==='loss'){
filtered=filtered.filter(t=>(t.result?.pnl||0)<=0);
}

// Update stats - use premium for open positions, result.pnl for closed
const total=allTrades.length;
const wins=allTrades.filter(t=>(t.result?.pnl||0)>0).length;
const totalPnl=allTrades.reduce((sum,t)=>{
  if (t.exit_price) {
    return sum+(t.result?.pnl||0);  // Closed trade: use realized P&L
  } else {
    return sum+(t.premium||0);  // Open trade: show premium collected
  }
},0);
const avg=total>0?totalPnl/total:0;

document.getElementById('total-trades').textContent=total;
document.getElementById('win-rate').textContent=total>0?((wins/total)*100).toFixed(0)+'%':'0%';
document.getElementById('total-pnl').textContent=(totalPnl>=0?'+':'')+fmt(totalPnl);
document.getElementById('total-pnl').className='statvalue '+(totalPnl>=0?'green':'');
document.getElementById('avg-trade').textContent=(avg>=0?'+':'')+fmt(avg);

// Render table
const container=document.getElementById('trades-content');
if(filtered.length===0){
container.innerHTML='<div class="empty"><p>No trades match filter</p></div>';
return;
}

let html='<table><thead><tr><th>Time (CST)</th><th>Symbol</th><th>Type</th><th>Contracts</th><th>Entry</th><th>P&L</th><th>Status</th></tr></thead><tbody>';

filtered.slice().reverse().forEach(t=>{
// For open positions, show premium collected; for closed, show realized P&L
const isOpen=!t.exit_price;
const pnl=isOpen?(t.premium||0):(t.result?.pnl||0);
const time=new Date(t.timestamp).toLocaleTimeString('en-US',{timeZone:'America/Chicago',hour:'2-digit',minute:'2-digit',hour12:false});
html+='<tr>';
html+='<td>'+time+'</td>';
html+='<td><span class="symbol">'+(t.symbol||'--')+'</span></td>';
html+='<td>'+(t.type||'--')+'</td>';
html+='<td>'+(t.contracts||'--')+'</td>';
html+='<td>$'+(t.entry_price||'--')+'</td>';
html+='<td class="'+(pnl>=0?'positive':'negative')+'">'+(pnl>=0?'+':'')+fmt(pnl)+'</td>';
html+='<td><span class="badge '+(isOpen?'badge-open':'badge-closed')+'">'+(isOpen?'OPEN':'CLOSED')+'</span></td>';
html+='</tr>';
});

html+='</tbody></table>';
container.innerHTML=html;
}

function filter(type){
currentFilter=type;
document.querySelectorAll('.filterbtn').forEach(btn=>btn.classList.remove('active'));
event.target.classList.add('active');
renderTrades();
}

if(sessionStorage.getItem('ww-auth')==='1'){load();setInterval(load,10000);}
</script>
</body>
</html>
