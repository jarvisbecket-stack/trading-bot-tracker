<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>White Wolf Clan | Trade History</title>
    <style>
        :root {
            --bg: #0a0a0f;
            --card: #12121a;
            --elevated: #1a1a25;
            --border: #2a2a3a;
            --text: #e8e8f0;
            --muted: #8b8b9e;
            --accent: #6366f1;
            --success: #10b981;
            --danger: #ef4444;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            line-height: 1.5;
        }
        
        #gate {
            position: fixed;
            inset: 0;
            background: var(--bg);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
        }
        .gate-box {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 40px;
            width: 90%;
            max-width: 380px;
            text-align: center;
        }
        .gate-logo {
            width: 64px;
            height: 64px;
            background: linear-gradient(135deg, var(--accent), #8b5cf6);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            font-size: 24px;
            font-weight: bold;
        }
        .gate-input {
            width: 100%;
            background: var(--elevated);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 12px;
            color: var(--text);
            font-size: 16px;
            text-align: center;
            margin: 16px 0;
        }
        .gate-input:focus { outline: none; border-color: var(--accent); }
        .gate-btn {
            width: 100%;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 12px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
        }
        .gate-error { color: var(--danger); margin-top: 12px; font-size: 14px; display: none; }
        
        #app { display: none; }
        .container { max-width: 1200px; margin: 0 auto; padding: 24px; }
        
        nav {
            background: var(--card);
            border-bottom: 1px solid var(--border);
            padding: 16px 24px;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .nav-inner {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: bold;
            font-size: 18px;
        }
        .brand-icon {
            width: 32px;
            height: 32px;
            background: linear-gradient(135deg, var(--accent), #8b5cf6);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
        }
        .nav-links { display: flex; gap: 8px; }
        .nav-links a {
            color: var(--muted);
            text-decoration: none;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 14px;
        }
        .nav-links a:hover, .nav-links a.active {
            background: rgba(99, 102, 241, 0.15);
            color: var(--accent);
        }
        
        .page-header {
            margin-bottom: 24px;
        }
        .page-header h1 {
            font-size: 28px;
            margin-bottom: 4px;
        }
        .page-header p {
            color: var(--muted);
            font-size: 14px;
        }
        
        /* Summary Stats */
        .stats-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }
        .stat-box {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
        }
        .stat-value {
            font-size: 32px;
            font-weight: bold;
            font-family: 'SF Mono', monospace;
        }
        .stat-value.success { color: var(--success); }
        .stat-value.danger { color: var(--danger); }
        .stat-label {
            font-size: 12px;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-top: 4px;
        }
        
        /* Filters */
        .filters {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .filter-btn {
            padding: 8px 16px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: var(--card);
            color: var(--muted);
            font-size: 13px;
            cursor: pointer;
        }
        .filter-btn:hover, .filter-btn.active {
            background: rgba(99, 102, 241, 0.15);
            border-color: var(--accent);
            color: var(--accent);
        }
        
        /* Table */
        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            overflow: hidden;
        }
        .table-wrap { overflow-x: auto; }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }
        th, td {
            padding: 12px 16px;
            text-align: left;
            border-bottom: 1px solid var(--border);
        }
        th {
            color: var(--muted);
            font-size: 12px;
            text-transform: uppercase;
            font-weight: 500;
            letter-spacing: 0.3px;
            background: var(--elevated);
        }
        tr:hover { background: rgba(99, 102, 241, 0.03); }
        .symbol { font-weight: 600; color: var(--accent); }
        .pnl { font-family: 'SF Mono', monospace; font-weight: 500; }
        .pnl.positive { color: var(--success); }
        .pnl.negative { color: var(--danger); }
        .tag {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
        }
        .tag-open { background: rgba(245, 158, 11, 0.15); color: var(--warning); }
        .tag-closed { background: rgba(16, 185, 129, 0.15); color: var(--success); }
        .tag-win { background: rgba(16, 185, 129, 0.15); color: var(--success); }
        .tag-loss { background: rgba(239, 68, 68, 0.15); color: var(--danger); }
        
        .empty {
            text-align: center;
            padding: 60px 20px;
            color: var(--muted);
        }
        .empty svg {
            width: 48px;
            height: 48px;
            margin-bottom: 16px;
            opacity: 0.4;
        }
    </style>
</head>
<body>
    <div id="gate">
        <div class="gate-box">
            <div class="gate-logo">WW</div>
            <h2>White Wolf Clan</h2>
            <p style="color: var(--muted); font-size: 14px; margin: 8px 0 24px;">Trade History • Restricted Access</p>
            <input type="password" id="pwd" class="gate-input" placeholder="Enter password">
            <button onclick="auth()" class="gate-btn">Access Trades</button>
            <p id="err" class="gate-error">Invalid password</p>
        </div>
    </div>

    <div id="app">
        <nav>
            <div class="nav-inner">
                <div class="brand">
                    <div class="brand-icon">WW</div>
                    White Wolf Clan
                </div>
                <div class="nav-links">
                    <a href="index.html">Dashboard</a>
                    <a href="positions.html">Positions</a>
                    <a href="watchlist.html">Watchlist</a>
                    <a href="trades.html" class="active">Trades</a>
                </div>
            </div>
        </nav>

        <div class="container">
            <div class="page-header">
                <h1>Trade History</h1>
                <p>All transactions • Filterable • Exportable</p>
            </div>

            <!-- Summary -->
            <div class="stats-row">
                <div class="stat-box">
                    <div class="stat-value" id="total-trades">0</div>
                    <div class="stat-label">Total Trades</div>
                </div>
                <div class="stat-box">
                    <div class="stat-value" id="win-rate">0%</div>
                    <div class="stat-label">Win Rate</div>
                </div>
                <div class="stat-box">
                    <div class="stat-value" id="total-pnl">$0</div>
                    <div class="stat-label">Total P&L</div>
                </div>
                <div class="stat-box">
                    <div class="stat-value" id="avg-trade">$0</div>
                    <div class="stat-label">Avg Trade</div>
                </div>
            </div>

            <!-- Filters -->
            <div class="filters">
                <button class="filter-btn active" onclick="filter('all')">All Trades</button>
                <button class="filter-btn" onclick="filter('today')">Today</button>
                <button class="filter-btn" onclick="filter('week')">This Week</button>
                <button class="filter-btn" onclick="filter('win')">Winners</button>
                <button class="filter-btn" onclick="filter('loss')">Losers</button>
            </div>

            <!-- Table -->
            <div class="card">
                <div class="table-wrap">
                    <table id="trades-table">
                        <thead>
                            <tr>
                                <th>Date</th>
                                <th>Symbol</th>
                                <th>Type</th>
                                <th>Entry</th>
                                <th>Exit</th>
                                <th>P&L</th>
                                <th>Status</th>
                            </tr>
                        </thead>
                        <tbody id="trades-body">
                            <!-- Populated by JS -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        const PWD = 'jarvisb';
        function auth() {
            const input = document.getElementById('pwd').value;
            if (input === PWD) {
                sessionStorage.setItem('auth', '1');
                document.getElementById('gate').style.display = 'none';
                document.getElementById('app').style.display = 'block';
                load();
            } else {
                document.getElementById('err').style.display = 'block';
            }
        }
        document.getElementById('pwd').addEventListener('keypress', e => {
            if (e.key === 'Enter') auth();
        });
        if (sessionStorage.getItem('auth') === '1') {
            document.getElementById('gate').style.display = 'none';
            document.getElementById('app').style.display = 'block';
        }
        
        let allTrades = [];
        let currentFilter = 'all';
        
        function fmt$(n) {
            if (n == null) return '$--';
            return '$' + n.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});
        }
        
        function formatDate(ts) {
            if (!ts) return '--';
            const d = new Date(ts);
            return d.toLocaleDateString('en-US', {month: 'short', day: 'numeric'});
        }
        
        function updateStats(trades) {
            const total = trades.length;
            const wins = trades.filter(t => (t.pnl || 0) > 0).length;
            const winRate = total > 0 ? ((wins / total) * 100).toFixed(1) : 0;
            const totalPnl = trades.reduce((sum, t) => sum + (t.pnl || 0), 0);
            const avg = total > 0 ? totalPnl / total : 0;
            
            document.getElementById('total-trades').textContent = total;
            document.getElementById('win-rate').textContent = winRate + '%';
            
            const pnlEl = document.getElementById('total-pnl');
            pnlEl.textContent = (totalPnl >= 0 ? '+' : '') + fmt$(totalPnl);
            pnlEl.className = 'stat-value ' + (totalPnl >= 0 ? 'success' : 'danger');
            
            document.getElementById('avg-trade').textContent = (avg >= 0 ? '+' : '') + fmt$(avg);
        }
        
        function renderTrades(trades) {
            const tbody = document.getElementById('trades-body');
            
            if (trades.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="7" class="empty">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                                <rect x="3" y="3" width="18" height="18" rx="2"/>
                                <line x1="9" y1="9" x2="15" y2="9"/>
                                <line x1="9" y1="15" x2="15" y2="15"/>
                            </svg>
                            <p>No trades recorded</p>
                            <p style="font-size: 13px; margin-top: 8px;">Trading begins Monday 9:15 AM CST</p>
                        </td>
                    </tr>
                `;
                return;
            }
            
            tbody.innerHTML = trades.map(t => {
                const isWin = (t.pnl || 0) >= 0;
                const isOpen = !t.exit_price;
                return `
                    <tr>
                        <td>${formatDate(t.timestamp)}</td>
                        <td><span class="symbol">${t.symbol || '--'}</span></td>
                        <td>${t.type || '--'}</td>
                        <td>${t.entry_price ? '$' + t.entry_price.toFixed(2) : '--'}</td>
                        <td>${t.exit_price ? '$' + t.exit_price.toFixed(2) : '--'}</td>
                        <td class="pnl ${isWin ? 'positive' : 'negative'}">${isWin ? '+' : ''}${fmt$(t.pnl)}</td>
                        <td>
                            <span class="tag ${isOpen ? 'tag-open' : isWin ? 'tag-win' : 'tag-loss'}">
                                ${isOpen ? 'OPEN' : isWin ? 'WIN' : 'LOSS'}
                            </span>
                        </td>
                    </tr>
                `;
            }).join('');
        }
        
        function filter(type) {
            currentFilter = type;
            
            // Update button states
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.remove('active');
                if (btn.textContent.toLowerCase().includes(type) || 
                    (type === 'all' && btn.textContent.includes('All'))) {
                    btn.classList.add('active');
                }
            });
            
            let filtered = [...allTrades];
            
            if (type === 'today') {
                const today = new Date().toDateString();
                filtered = filtered.filter(t => new Date(t.timestamp).toDateString() === today);
            } else if (type === 'week') {
                const weekAgo = new Date(Date.now() - 7 * 24 * 60 * 60 * 1000);
                filtered = filtered.filter(t => new Date(t.timestamp) >= weekAgo);
            } else if (type === 'win') {
                filtered = filtered.filter(t => (t.pnl || 0) > 0);
            } else if (type === 'loss') {
                filtered = filtered.filter(t => (t.pnl || 0) <= 0);
            }
            
            renderTrades(filtered);
            updateStats(filtered);
        }
        
        async function load() {
            try {
                const r = await fetch('data/trade_chronicle.jsonl?_=' + Date.now(), {cache: 'no-store'});
                if (r.ok) {
                    const text = await r.text();
                    allTrades = text.trim().split('\n')
                        .filter(l => l.trim())
                        .map(l => { try { return JSON.parse(l); } catch { return null; } })
                        .filter(t => t !== null);
                }
            } catch (e) {
                console.log('No trade data');
            }
            filter('all');
        }
        
        if (sessionStorage.getItem('auth') === '1') {
            load();
            setInterval(load, 30000);
        }
    </script>
</body>
</html>
