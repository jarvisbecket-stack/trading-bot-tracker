<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>White Wolf Clan | Trade History</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
body{background:#0a0a0f;color:#e8e8f0;min-height:100vh;overflow-x:hidden}

#app{max-width:100vw;overflow-x:hidden}

nav{background:#12121a;border-bottom:1px solid #2a2a3a;padding:12px 16px;position:sticky;top:0;z-index:100}
.navinner{max-width:100%;margin:0 auto;display:flex;justify-content:space-between;align-items:center}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px}
.brandicon{width:28px;height:28px;background:linear-gradient(135deg,#6366f1,#8b5cf6);border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:12px}
.navlinks{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;-ms-overflow-style:none}
.navlinks::-webkit-scrollbar{display:none}
.navlinks a{color:#8b8b9e;text-decoration:none;padding:8px 12px;border-radius:6px;font-size:13px;font-weight:500;white-space:nowrap}
.navlinks a:hover,.navlinks a.active{background:rgba(99,102,241,.15);color:#6366f1}

.container{padding:16px;padding-bottom:80px;max-width:100vw}

.page-header{margin-bottom:20px}
.page-title{font-size:24px;font-weight:700;margin-bottom:4px}
.page-subtitle{font-size:13px;color:#8b8b9e}

.summary-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:16px}
.summary-card{background:#12121a;border:1px solid #2a2a3a;border-radius:12px;padding:16px;text-align:center}
.summary-value{font-size:24px;font-weight:700;font-family:monospace}
.summary-value.green{color:#10b981}
.summary-value.red{color:#ef4444}
.summary-label{font-size:11px;color:#8b8b9e;margin-top:4px}

.section-header{display:flex;justify-content:space-between;align-items:center;margin:20px 0 12px}
.section-title{font-size:14px;font-weight:600;color:#8b8b9e;text-transform:uppercase;letter-spacing:0.5px}
.section-badge{background:rgba(99,102,241,.15);color:#6366f1;padding:4px 10px;border-radius:20px;font-size:12px;font-weight:600}

.trade-card{background:#12121a;border:1px solid #2a2a3a;border-radius:16px;padding:16px;margin-bottom:12px}
.trade-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.trade-symbol{background:linear-gradient(135deg,#6366f1,#8b5cf6);padding:6px 12px;border-radius:8px;font-weight:700;font-size:14px}
.trade-status-open{background:rgba(16,185,129,.15);color:#10b981;padding:4px 10px;border-radius:20px;font-size:11px;font-weight:600}
.trade-status-closed{background:rgba(99,102,241,.15);color:#6366f1;padding:4px 10px;border-radius:20px;font-size:11px;font-weight:600}
.trade-details{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:12px}
.trade-detail{text-align:center;padding:12px;background:#0a0a0f;border-radius:8px}
.trade-detail-label{font-size:10px;color:#64748b;text-transform:uppercase;margin-bottom:4px}
.trade-detail-value{font-size:16px;font-weight:600;font-family:monospace}
.trade-premium{text-align:center;padding:16px;background:#0a0a0f;border-radius:12px;margin-bottom:12px}
.trade-premium-label{font-size:11px;color:#64748b;text-transform:uppercase;letter-spacing:1px;margin-bottom:4px}
.trade-premium-value{font-size:28px;font-weight:800;color:#10b981;font-family:monospace}
.trade-footer{display:flex;justify-content:space-between;align-items:center;padding-top:12px;border-top:1px solid #2a2a3a;font-size:12px;color:#64748b}

.empty{text-align:center;padding:40px 20px;color:#64748b}
.empty-icon{font-size:48px;margin-bottom:16px}

#statusbar{position:fixed;bottom:0;left:0;right:0;background:#12121a;border-top:1px solid #2a2a3a;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;font-size:11px;color:#64748b;z-index:100}
.status-live{color:#10b981;display:flex;align-items:center;gap:6px}
.status-live::before{content:'';width:6px;height:6px;background:#10b981;border-radius:50%;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
</style>
</head>
<body>
<div id="app">
<nav><div class="navinner">
<div class="brand"><div class="brandicon">WW</div>White Wolf</div>
<div class="navlinks">
<a href="index.html">Dashboard</a>
<a href="positions.html">Positions</a>
<a href="trades.html" class="active">Trades</a>
<a href="news.html">News</a>
</div>
</div></nav>

<div class="container">
<div class="page-header">
<div class="page-title">📜 Trade History</div>
<div class="page-subtitle">White Wolf Clan Fund - All Transactions</div>
</div>

<div class="summary-grid">
<div class="summary-card">
<div class="summary-value" id="total-trades">-</div>
<div class="summary-label">Total Trades</div>
</div>
<div class="summary-card">
<div class="summary-value green" id="win-rate">-</div>
<div class="summary-label">Win Rate</div>
</div>
<div class="summary-card">
<div class="summary-value green" id="premium-collected">-</div>
<div class="summary-label">Premium Collected</div>
</div>
<div class="summary-card">
<div class="summary-value" id="realized-pnl">-</div>
<div class="summary-label">Realized P&L</div>
</div>
</div>

<div class="section-header">
<div class="section-title">🟢 Active Positions</div>
<div class="section-badge" id="active-count">-</div>
</div>
<div id="active-trades"></div>

<div class="section-header">
<div class="section-title">🔴 Closed Positions</div>
<div class="section-badge" id="closed-count">-</div>
</div>
<div id="closed-trades"></div>
</div>

<div id="statusbar">
<span>White Wolf Clan Fund</span>
<span class="status-live">Live</span>
</div>
</div>

<script>
function fmt(n){if(n==null||isNaN(n))return'$0';return'$'+n.toLocaleString('en-US',{minimumFractionDigits:0,maximumFractionDigits:0})}
function fmtDec(n){if(n==null||isNaN(n))return'$0.00';return'$'+n.toFixed(2)}

async function load(){
try{
const ts=Date.now();
const response=await fetch('data/fund_state.json?cb='+ts,{cache:'no-store',headers:{'Cache-Control':'no-cache'}});
if(!response.ok)throw new Error('HTTP '+response.status);
const data=await response.json();

// Update summary
document.getElementById('total-trades').textContent=data.total_trades||0;
document.getElementById('win-rate').textContent=(data.win_rate||0).toFixed(1)+'%';
document.getElementById('premium-collected').textContent=fmt(data.total_premium_collected||0);
const pnlEl=document.getElementById('realized-pnl');
pnlEl.textContent=(data.realized_pnl>=0?'+':'')+fmtDec(data.realized_pnl||0);
pnlEl.className='summary-value '+(data.realized_pnl>=0?'green':'red');

// Active positions
const active=data.active_positions||[];
document.getElementById('active-count').textContent=active.length;
const activeContainer=document.getElementById('active-trades');
if(active.length===0){
activeContainer.innerHTML='<div class="empty"><div class="empty-icon">📭</div>No active positions</div>';
}else{
activeContainer.innerHTML=active.map(p=>{
const dte=Math.ceil((new Date(p.expiration)-new Date())/(1000*60*60*24));
return `<div class="trade-card">
<div class="trade-header">
<span class="trade-symbol">${p.symbol}</span>
<span class="trade-status-open">${p.status}</span>
</div>
<div class="trade-premium">
<div class="trade-premium-label">Premium Collected</div>
<div class="trade-premium-value">${fmt(p.entry_premium_total)}</div>
</div>
<div class="trade-details">
<div class="trade-detail"><div class="trade-detail-label">Strike</div><div class="trade-detail-value">$${p.strike.toFixed(2)}</div></div>
<div class="trade-detail"><div class="trade-detail-label">Contracts</div><div class="trade-detail-value">${p.contracts}</div></div>
<div class="trade-detail"><div class="trade-detail-label">Expiration</div><div class="trade-detail-value">${p.expiration}</div></div>
<div class="trade-detail"><div class="trade-detail-label">DTE</div><div class="trade-detail-value">${dte}</div></div>
</div>
<div class="trade-footer">
<span>Entry: ${p.entry_date.split(' ')[0]}</span>
<span>Strategy: ${p.strategy}</span>
</div>
</div>`;
}).join('');
}

// Closed positions
const closed=data.closed_positions||[];
document.getElementById('closed-count').textContent=closed.length;
const closedContainer=document.getElementById('closed-trades');
if(closed.length===0){
closedContainer.innerHTML='<div class="empty"><div class="empty-icon">📭</div>No closed positions</div>';
}else{
closedContainer.innerHTML=closed.map(p=>{
const pnlClass=p.realized_pnl>=0?'green':'red';
return `<div class="trade-card">
<div class="trade-header">
<span class="trade-symbol">${p.symbol}</span>
<span class="trade-status-closed">CLOSED</span>
</div>
<div class="trade-premium">
<div class="trade-premium-label">Realized P&L</div>
<div class="trade-premium-value" style="color:${p.realized_pnl>=0?'#10b981':'#ef4444'}">${p.realized_pnl>=0?'+':''}${fmtDec(p.realized_pnl)}</div>
</div>
<div class="trade-details">
<div class="trade-detail"><div class="trade-detail-label">Strike</div><div class="trade-detail-value">$${p.strike.toFixed(2)}</div></div>
<div class="trade-detail"><div class="trade-detail-label">Contracts</div><div class="trade-detail-value">${p.contracts}</div></div>
<div class="trade-detail"><div class="trade-detail-label">Entry</div><div class="trade-detail-value">${p.entry_date.split(' ')[0]}</div></div>
<div class="trade-detail"><div class="trade-detail-label">Exit</div><div class="trade-detail-value">${p.exit_date?p.exit_date.split(' ')[0]:'-'}</div></div>
</div>
<div class="trade-footer">
<span>Reason: ${p.exit_reason||'-'}</span>
<span>Strategy: ${p.strategy}</span>
</div>
</div>`;
}).join('');
}

}catch(e){
console.error('Load error:',e);
document.getElementById('active-trades').innerHTML='<div class="empty">Error loading data</div>';
document.getElementById('closed-trades').innerHTML='<div class="empty">Error loading data</div>';
}
}

document.addEventListener('DOMContentLoaded',()=>{
load();
setInterval(load,30000);
});
</script>
</body>
</html>
