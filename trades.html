<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>White Wolf Clan | Trade History</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
body{background:#0a0a0f;color:#e8e8f0;min-height:100vh;overflow-x:hidden;box-sizing:border-box}

#app{max-width:100vw;overflow-x:hidden;box-sizing:border-box}

nav{background:#12121a;border-bottom:1px solid #2a2a3a;padding:12px 16px;position:sticky;top:0;z-index:100}
.navinner{max-width:100%;margin:0 auto;display:flex;justify-content:space-between;align-items:center}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px}
.brandicon{width:28px;height:28px;background:linear-gradient(135deg,#6366f1,#8b5cf6);border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:12px}
.navlinks{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;-ms-overflow-style:none}
.navlinks::-webkit-scrollbar{display:none}
.navlinks a{color:#8b8b9e;text-decoration:none;padding:8px 12px;border-radius:6px;font-size:13px;font-weight:500;white-space:nowrap}
.navlinks a:hover,.navlinks a.active{background:rgba(99,102,241,.15);color:#6366f1}

.container{padding:16px;padding-bottom:80px;max-width:100vw}

/* Page Header */
.page-header{margin-bottom:20px}
.page-title{font-size:24px;font-weight:700;margin-bottom:4px}
.page-subtitle{font-size:13px;color:#8b8b9e}

/* Summary Cards */
.summary-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:20px}
.summary-card{background:#12121a;border:1px solid #2a2a3a;border-radius:16px;padding:16px;text-align:center}
.summary-value{font-size:28px;font-weight:800;font-family:monospace;margin-bottom:4px}
.summary-value.green{color:#10b981}
.summary-value.red{color:#ef4444}
.summary-label{font-size:11px;color:#8b8b9e;text-transform:uppercase;letter-spacing:0.5px}

/* Filter Tabs */
.filter-tabs{display:flex;gap:8px;margin-bottom:20px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.filter-tabs::-webkit-scrollbar{display:none}
.filter-tab{background:#12121a;border:1px solid #2a2a3a;border-radius:20px;padding:8px 16px;font-size:13px;font-weight:500;color:#8b8b9e;cursor:pointer;white-space:nowrap}
.filter-tab.active{background:rgba(99,102,241,.15);border-color:#6366f1;color:#6366f1}

/* Trade Cards */
.trade-list{display:flex;flex-direction:column;gap:12px}
.trade-card{background:#12121a;border:1px solid #2a2a3a;border-radius:16px;padding:16px}
.trade-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.trade-symbol{background:linear-gradient(135deg,#6366f1,#8b5cf6);padding:6px 12px;border-radius:8px;font-weight:700;font-size:14px}
.trade-status{font-size:11px;padding:4px 10px;border-radius:12px;font-weight:600;text-transform:uppercase}
.trade-status.open{background:rgba(16,185,129,.1);color:#10b981}
.trade-status.closed{background:rgba(100,116,139,.1);color:#64748b}

.trade-details{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;margin-bottom:16px}
.trade-detail{display:flex;flex-direction:column;gap:4px}
.trade-detail-label{font-size:10px;color:#64748b;text-transform:uppercase}
.trade-detail-value{font-size:15px;font-weight:600;font-family:monospace}
.trade-detail-value.strike{color:#6366f1}
.trade-detail-value.premium{color:#10b981}

.trade-pnl{display:flex;justify-content:space-between;align-items:center;background:#0a0a0f;border-radius:12px;padding:12px 16px}
.trade-pnl-label{font-size:13px;font-weight:500}
.trade-pnl-value{font-size:20px;font-weight:800;font-family:monospace}
.trade-pnl-value.positive{color:#10b981}
.trade-pnl-value.negative{color:#ef4444}

/* Empty State */
.empty{text-align:center;padding:60px 20px;color:#64748b;font-size:14px}
.empty-icon{font-size:48px;margin-bottom:16px}

/* Status Bar */
#statusbar{position:fixed;bottom:0;left:0;right:0;background:#12121a;border-top:1px solid #2a2a3a;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;font-size:11px;color:#64748b;z-index:100}
.status-live{color:#10b981;display:flex;align-items:center;gap:6px}
.status-live::before{content:'';width:6px;height:6px;background:#10b981;border-radius:50%;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}

.positive{color:#10b981}
.negative{color:#ef4444}
</style>
</head>
<body>
<div id="app">
<nav><div class="navinner">
<div class="brand"><div class="brandicon">WW</div>White Wolf</div>
<div class="navlinks">
<a href="index.html">Dashboard</a>
<a href="positions.html">Positions</a>
<a href="trades.html" class="active">Trades</a>
<a href="news.html">Intel</a>
</div>
</div></nav>

<div class="container">
<div class="page-header">
<div class="page-title">Trade History</div>
<div class="page-subtitle">All transactions • CST timezone</div>
</div>

<!-- Summary -->
<div class="summary-grid">
<div class="summary-card">
<div class="summary-value green" id="total-pnl">--</div>
<div class="summary-label">Total P&L</div>
</div>
<div class="summary-card">
<div class="summary-value" id="total-trades">--</div>
<div class="summary-label">Total Trades</div>
</div>
</div>

<!-- Filters -->
<div class="filter-tabs">
<div class="filter-tab active" onclick="filter('all')">All Trades</div>
<div class="filter-tab" onclick="filter('open')">Open</div>
<div class="filter-tab" onclick="filter('closed')">Closed</div>
</div>

<!-- Trade List -->
<div id="trade-list" class="trade-list">
<div class="empty"><div class="empty-icon">📊</div>Loading trades...</div>
</div>
</div>

<div id="statusbar">
<span id="last-update">--</span>
<span class="status-live">Live</span>
</div>
</div>

<script>
let allTrades=[];
let currentFilter='all';

function fmt(n){if(n==null||isNaN(n))return'$0';return'$'+n.toLocaleString('en-US',{minimumFractionDigits:0,maximumFractionDigits:0});}
function fmtDec(n){if(n==null||isNaN(n))return'$0.00';return '$'+n.toFixed(2);}

async function load(){
try{
const ts=Date.now();
const r=await fetch('data/trade_chronicle.jsonl?cb='+ts,{cache:'no-store',headers:{'Cache-Control':'no-cache'}});
if(!r.ok)throw new Error('HTTP '+r.status);
const text=await r.text();
const lines=text.trim().split('\n').filter(l=>l.trim());
allTrades=lines.map(line=>{try{return JSON.parse(line);}catch(e){return null;}}).filter(t=>t!==null);
renderTrades();
document.getElementById('last-update').textContent='Updated '+new Date().toLocaleTimeString('en-US',{timeZone:'America/Chicago',hour12:false,hour:'2-digit',minute:'2-digit'})+' CST';
}catch(e){
console.error('Load error:',e);
document.getElementById('trade-list').innerHTML='<div class="empty">Error loading trades</div>';
}
}

function renderTrades(){
let filtered=[...allTrades];
if(currentFilter==='open')filtered=allTrades.filter(t=>!t.exit_time);
if(currentFilter==='closed')filtered=allTrades.filter(t=>t.exit_time);

const totalTrades=allTrades.length;
const totalPnl=allTrades.reduce((sum,t)=>sum+(t.result?.pnl||0),0);
document.getElementById('total-trades').textContent=totalTrades;
document.getElementById('total-pnl').textContent=(totalPnl>=0?'+':'')+fmtDec(totalPnl);
document.getElementById('total-pnl').className='summary-value '+(totalPnl>=0?'green':'red');

const container=document.getElementById('trade-list');
if(filtered.length===0){
container.innerHTML='<div class="empty"><div class="empty-icon">📭</div>No trades found</div>';
return;
}

let html='';
filtered.slice().reverse().forEach(t=>{
const isOpen=!t.exit_time;
const pnl=t.result?.pnl||0;
const pnlClass=pnl>=0?'positive':'negative';
const time=new Date(t.timestamp).toLocaleTimeString('en-US',{timeZone:'America/Chicago',hour:'2-digit',minute:'2-digit',hour12:false});
const date=new Date(t.timestamp).toLocaleDateString('en-US',{month:'short',day:'numeric'});
const pnlLabel=isOpen?'Unrealized P&L':'Realized P&L';

html+='<div class="trade-card">';
html+='<div class="trade-header">';
html+='<span class="trade-symbol">'+t.symbol+'</span>';
html+='<span class="trade-status '+(isOpen?'open':'closed')+'">'+(isOpen?'OPEN':'CLOSED')+'</span>';
html+='</div>';
html+='<div class="trade-details">';
html+='<div class="trade-detail"><span class="trade-detail-label">Strike</span><span class="trade-detail-value strike">$'+t.strike+'</span></div>';
html+='<div class="trade-detail"><span class="trade-detail-label">Contracts</span><span class="trade-detail-value">'+t.contracts+'</span></div>';
html+='<div class="trade-detail"><span class="trade-detail-label">Date</span><span class="trade-detail-value">'+date+' '+time+'</span></div>';
html+='<div class="trade-detail"><span class="trade-detail-label">Premium</span><span class="trade-detail-value premium">'+fmt(t.premium)+'</span></div>';
html+='</div>';
html+='<div class="trade-pnl">';
html+='<span class="trade-pnl-label">'+pnlLabel+'</span>';
html+='<span class="trade-pnl-value '+pnlClass+'">'+(pnl>=0?'+':'')+fmtDec(pnl)+'</span>';
html+='</div>';
html+='</div>';
});
container.innerHTML=html;
}

function filter(type){
currentFilter=type;
document.querySelectorAll('.filter-tab').forEach(tab=>tab.classList.remove('active'));
event.target.classList.add('active');
renderTrades();
}

// Auto-load on DOM ready
document.addEventListener('DOMContentLoaded',()=>{
load();
});
</script>
</body>
</html>
