<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>White Wolf Clan | Watchlist</title>
    <style>
        :root {
            --bg: #0a0a0f;
            --card: #12121a;
            --elevated: #1a1a25;
            --border: #2a2a3a;
            --text: #e8e8f0;
            --muted: #8b8b9e;
            --accent: #6366f1;
            --success: #10b981;
            --danger: #ef4444;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            line-height: 1.5;
        }
        
        #gate {
            position: fixed;
            inset: 0;
            background: var(--bg);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
        }
        .gate-box {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 40px;
            width: 90%;
            max-width: 380px;
            text-align: center;
        }
        .gate-logo {
            width: 64px;
            height: 64px;
            background: linear-gradient(135deg, var(--accent), #8b5cf6);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            font-size: 24px;
            font-weight: bold;
        }
        .gate-input {
            width: 100%;
            background: var(--elevated);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 12px;
            color: var(--text);
            font-size: 16px;
            text-align: center;
            margin: 16px 0;
        }
        .gate-input:focus { outline: none; border-color: var(--accent); }
        .gate-btn {
            width: 100%;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 12px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
        }
        .gate-error { color: var(--danger); margin-top: 12px; font-size: 14px; display: none; }
        
        #app { display: none; }
        .container { max-width: 1200px; margin: 0 auto; padding: 24px; }
        
        nav {
            background: var(--card);
            border-bottom: 1px solid var(--border);
            padding: 16px 24px;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .nav-inner {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: bold;
            font-size: 18px;
        }
        .brand-icon {
            width: 32px;
            height: 32px;
            background: linear-gradient(135deg, var(--accent), #8b5cf6);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
        }
        .nav-links { display: flex; gap: 8px; }
        .nav-links a {
            color: var(--muted);
            text-decoration: none;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 14px;
        }
        .nav-links a:hover, .nav-links a.active {
            background: rgba(99, 102, 241, 0.15);
            color: var(--accent);
        }
        
        .page-header {
            margin-bottom: 24px;
        }
        .page-header h1 {
            font-size: 28px;
            margin-bottom: 4px;
        }
        .page-header p {
            color: var(--muted);
            font-size: 14px;
        }
        
        /* Watchlist Table */
        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            overflow: hidden;
        }
        .table-wrap { overflow-x: auto; }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }
        th, td {
            padding: 14px 16px;
            text-align: left;
            border-bottom: 1px solid var(--border);
        }
        th {
            color: var(--muted);
            font-size: 12px;
            text-transform: uppercase;
            font-weight: 500;
            letter-spacing: 0.3px;
            background: var(--elevated);
        }
        tr:hover { background: rgba(99, 102, 241, 0.03); }
        .symbol {
            font-weight: 600;
            color: var(--accent);
        }
        .price {
            font-family: 'SF Mono', monospace;
            font-weight: 500;
        }
        .change.positive { color: var(--success); }
        .change.negative { color: var(--danger); }
        .allocation {
            display: inline-block;
            padding: 4px 10px;
            background: rgba(99, 102, 241, 0.15);
            border-radius: 4px;
            font-size: 12px;
            font-weight: 500;
        }
        .strategy {
            font-size: 12px;
            color: var(--muted);
        }
        .iv-high { color: var(--danger); }
        .iv-med { color: var(--warning); }
        .iv-low { color: var(--success); }
        
        .empty {
            text-align: center;
            padding: 60px 20px;
            color: var(--muted);
        }
        .empty svg {
            width: 48px;
            height: 48px;
            margin-bottom: 16px;
            opacity: 0.4;
        }
    </style>
</head>
<body>
    <div id="gate">
        <div class="gate-box">
            <div class="gate-logo">WW</div>
            <h2>White Wolf Clan</h2>
            <p style="color: var(--muted); font-size: 14px; margin: 8px 0 24px;">Watchlist • Restricted Access</p>
            <input type="password" id="pwd" class="gate-input" placeholder="Enter password">
            <button onclick="auth()" class="gate-btn">Access Watchlist</button>
            <p id="err" class="gate-error">Invalid password</p>
        </div>
    </div>

    <div id="app">
        <nav>
            <div class="nav-inner">
                <div class="brand">
                    <div class="brand-icon">WW</div>
                    White Wolf Clan
                </div>
                <div class="nav-links">
                    <a href="index.html">Dashboard</a>
                    <a href="positions.html">Positions</a>
                    <a href="watchlist.html" class="active">Watchlist</a>
                    <a href="trades.html">Trades</a>
                </div>
            </div>
        </nav>

        <div class="container">
            <div class="page-header">
                <h1>Watchlist</h1>
                <p>19 targets • Allocation strategy • DTE planning</p>
            </div>

            <div class="card">
                <div class="table-wrap">
                    <table id="watchlist-table">
                        <thead>
                            <tr>
                                <th>Symbol</th>
                                <th>Price</th>
                                <th>Change</th>
                                <th>IV</th>
                                <th>Allocation</th>
                                <th>Strategy</th>
                                <th>DTE</th>
                            </tr>
                        </thead>
                        <tbody id="watchlist-body">
                            <!-- Populated by JS -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        const PWD = 'jarvisb';
        function auth() {
            const input = document.getElementById('pwd').value;
            if (input === PWD) {
                sessionStorage.setItem('auth', '1');
                document.getElementById('gate').style.display = 'none';
                document.getElementById('app').style.display = 'block';
                load();
            } else {
                document.getElementById('err').style.display = 'block';
            }
        }
        document.getElementById('pwd').addEventListener('keypress', e => {
            if (e.key === 'Enter') auth();
        });
        if (sessionStorage.getItem('auth') === '1') {
            document.getElementById('gate').style.display = 'none';
            document.getElementById('app').style.display = 'block';
        }
        
        // Default watchlist data
        const DEFAULT_WATCHLIST = [
            { symbol: 'SPY', price: 595.42, change: 0.85, iv: 18.5, allocation: '10%', strategy: 'ORB Fade', dte: '0-7' },
            { symbol: 'QQQ', price: 512.18, change: 1.12, iv: 22.3, allocation: '8%', strategy: 'Liquidity Grab', dte: '0-7' },
            { symbol: 'AAPL', price: 229.87, change: -0.42, iv: 25.1, allocation: '6%', strategy: 'Wheel', dte: '7-14' },
            { symbol: 'TSLA', price: 248.50, change: 2.15, iv: 68.4, allocation: '5%', strategy: 'Momentum', dte: '0-3' },
            { symbol: 'NVDA', price: 138.25, change: 1.85, iv: 52.7, allocation: '6%', strategy: 'Scalp', dte: '0-3' },
            { symbol: 'AMD', price: 118.42, change: -0.95, iv: 45.2, allocation: '5%', strategy: 'Scalp', dte: '0-3' },
            { symbol: 'COIN', price: 245.80, change: 3.25, iv: 78.5, allocation: '4%', strategy: 'Crypto Play', dte: '0-3' },
            { symbol: 'MSTR', price: 342.15, change: 5.42, iv: 85.2, allocation: '3%', strategy: 'BTC Proxy', dte: '0-3' },
            { symbol: 'META', price: 582.35, change: 0.65, iv: 28.4, allocation: '5%', strategy: 'Wheel', dte: '7-14' },
            { symbol: 'AMZN', price: 198.42, change: -0.28, iv: 32.1, allocation: '5%', strategy: 'Wheel', dte: '7-14' },
            { symbol: 'MSFT', price: 425.18, change: 0.42, iv: 20.5, allocation: '6%', strategy: 'Conservative', dte: '14-21' },
            { symbol: 'GOOGL', price: 176.25, change: 0.18, iv: 24.8, allocation: '5%', strategy: 'Wheel', dte: '7-14' },
            { symbol: 'NFLX', price: 885.42, change: 1.95, iv: 38.5, allocation: '4%', strategy: 'Momentum', dte: '0-7' },
            { symbol: 'CRM', price: 312.85, change: -0.65, iv: 35.2, allocation: '4%', strategy: 'Swing', dte: '7-14' },
            { symbol: 'BAC', price: 46.82, change: 0.12, iv: 28.5, allocation: '5%', strategy: 'Wheel', dte: '14-30' },
            { symbol: 'KO', price: 63.45, change: 0.05, iv: 16.2, allocation: '7%', strategy: 'Income', dte: '21-35' },
            { symbol: 'VZ', price: 42.18, change: -0.08, iv: 18.5, allocation: '6%', strategy: 'Income', dte: '21-35' },
            { symbol: 'XLE', price: 95.42, change: 0.95, iv: 25.8, allocation: '5%', strategy: 'Safe Haven', dte: '7-14' },
            { symbol: 'GLD', price: 242.18, change: 0.45, iv: 15.2, allocation: '4%', strategy: 'Hedge', dte: '14-30' }
        ];
        
        function renderWatchlist(data) {
            const tbody = document.getElementById('watchlist-body');
            tbody.innerHTML = data.map(stock => {
                const changeClass = stock.change >= 0 ? 'positive' : 'negative';
                const changeSign = stock.change >= 0 ? '+' : '';
                const ivClass = stock.iv > 50 ? 'iv-high' : stock.iv > 30 ? 'iv-med' : 'iv-low';
                
                return `
                    <tr>
                        <td><span class="symbol">${stock.symbol}</span></td>
                        <td class="price">$${stock.price.toFixed(2)}</td>
                        <td class="change ${changeClass}">${changeSign}${stock.change.toFixed(2)}%</td>
                        <td class="${ivClass}">${stock.iv.toFixed(1)}%</td>
                        <td><span class="allocation">${stock.allocation}</span></td>
                        <td class="strategy">${stock.strategy}</td>
                        <td>${stock.dte}</td>
                    </tr>
                `;
            }).join('');
        }
        
        async function load() {
            try {
                const r = await fetch('data/watchlist.json?_=' + Date.now(), {cache: 'no-store'});
                if (r.ok) {
                    const data = await r.json();
                    renderWatchlist(data);
                } else {
                    throw new Error('Using default');
                }
            } catch (e) {
                renderWatchlist(DEFAULT_WATCHLIST);
            }
        }
        
        if (sessionStorage.getItem('auth') === '1') {
            load();
        }
    </script>
</body>
</html>
