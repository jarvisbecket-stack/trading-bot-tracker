<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>White Wolf Clan | Command Center</title>
<style>
:root {
  --bg-primary: #0a0a0f;
  --bg-secondary: #12121a;
  --bg-card: #1a1a25;
  --border: #2a2a3a;
  --text-primary: #f0f0f5;
  --text-secondary: #8b8b9e;
  --text-muted: #64748b;
  --accent: #6366f1;
  --accent-secondary: #8b5cf6;
  --profit: #10b981;
  --loss: #ef4444;
  --warning: #f59e0b;
}

* { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }

body {
  background: var(--bg-primary);
  color: var(--text-primary);
  min-height: 100vh;
  overflow-x: hidden;
}

/* Navigation */
nav {
  background: rgba(18, 18, 26, 0.95);
  backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--border);
  padding: 12px 16px;
  position: sticky;
  top: 0;
  z-index: 100;
}

.nav-inner {
  max-width: 600px;
  margin: 0 auto;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  font-weight: 700;
  font-size: 18px;
}

.brand-icon {
  width: 36px;
  height: 36px;
  background: linear-gradient(135deg, var(--accent), var(--accent-secondary));
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
  font-weight: 800;
}

.nav-links {
  display: flex;
  gap: 8px;
}

.nav-links a {
  color: var(--text-secondary);
  text-decoration: none;
  padding: 8px 14px;
  border-radius: 8px;
  font-size: 14px;
  font-weight: 500;
  transition: all 0.2s;
}

.nav-links a:hover, .nav-links a.active {
  background: rgba(99, 102, 241, 0.15);
  color: var(--accent);
}

/* Container */
.container {
  max-width: 600px;
  margin: 0 auto;
  padding: 20px 16px 100px;
}

/* HERO SECTION */
.hero {
  text-align: center;
  padding: 32px 0 24px;
  position: relative;
}

.hero::before {
  content: '';
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 300px;
  height: 300px;
  background: radial-gradient(circle, rgba(99, 102, 241, 0.15) 0%, transparent 70%);
  pointer-events: none;
}

.hero-label {
  font-size: 13px;
  color: var(--text-secondary);
  text-transform: uppercase;
  letter-spacing: 2px;
  margin-bottom: 12px;
}

.hero-value {
  font-size: 52px;
  font-weight: 800;
  font-family: 'SF Mono', Monaco, monospace;
  letter-spacing: -2px;
  background: linear-gradient(135deg, #fff 0%, #a5a5b5 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.hero-change {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  margin-top: 16px;
  padding: 8px 16px;
  border-radius: 20px;
  font-size: 15px;
  font-weight: 600;
}

.hero-change.profit {
  background: rgba(16, 185, 129, 0.15);
  color: var(--profit);
}

.hero-change.loss {
  background: rgba(239, 68, 68, 0.15);
  color: var(--loss);
}

/* STATS ROW */
.stats-row {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
  margin-bottom: 28px;
}

.stat-item {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 16px 12px;
  text-align: center;
  transition: transform 0.2s;
}

.stat-item:hover {
  transform: translateY(-2px);
}

.stat-label {
  font-size: 11px;
  color: var(--text-secondary);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-bottom: 6px;
}

.stat-value {
  font-size: 20px;
  font-weight: 700;
  font-family: 'SF Mono', Monaco, monospace;
}

.stat-value.profit { color: var(--profit); }
.stat-value.loss { color: var(--loss); }

/* SECTION HEADER */
.section-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 16px;
}

.section-title {
  font-size: 18px;
  font-weight: 700;
}

.section-subtitle {
  font-size: 13px;
  color: var(--text-secondary);
}

/* POSITION CARDS */
.position-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 20px;
  margin-bottom: 16px;
  position: relative;
  overflow: hidden;
}

.position-card::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 3px;
  background: linear-gradient(90deg, var(--accent), var(--accent-secondary));
}

.position-card.profit::before {
  background: linear-gradient(90deg, var(--profit), #059669);
}

.position-card.loss::before {
  background: linear-gradient(90deg, var(--loss), #dc2626);
}

.position-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  margin-bottom: 16px;
}

.position-symbol {
  display: flex;
  align-items: center;
  gap: 12px;
}

.symbol-badge {
  background: linear-gradient(135deg, var(--accent), var(--accent-secondary));
  padding: 8px 14px;
  border-radius: 10px;
  font-weight: 800;
  font-size: 16px;
}

.position-meta {
  text-align: right;
}

.position-strike {
  font-size: 14px;
  font-weight: 600;
  color: var(--text-primary);
}

.position-contracts {
  font-size: 12px;
  color: var(--text-secondary);
}

/* PREMIUM DISPLAY */
.premium-display {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 20px;
  background: rgba(16, 185, 129, 0.08);
  border: 1px solid rgba(16, 185, 129, 0.2);
  border-radius: 16px;
  margin-bottom: 16px;
}

.premium-label {
  font-size: 13px;
  color: var(--text-secondary);
}

.premium-value {
  font-size: 32px;
  font-weight: 800;
  color: var(--profit);
  font-family: 'SF Mono', Monaco, monospace;
}

/* METRICS GRID */
.metrics-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
  margin-bottom: 16px;
}

.metric {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 12px 16px;
  background: var(--bg-secondary);
  border-radius: 12px;
}

.metric-label {
  font-size: 12px;
  color: var(--text-secondary);
}

.metric-value {
  font-size: 15px;
  font-weight: 700;
  font-family: 'SF Mono', Monaco, monospace;
}

.metric-value.profit { color: var(--profit); }
.metric-value.loss { color: var(--loss); }

/* PROGRESS BAR */
.progress-section {
  margin-top: 16px;
}

.progress-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 8px;
}

.progress-label {
  font-size: 12px;
  color: var(--text-secondary);
}

.progress-value {
  font-size: 13px;
  font-weight: 600;
}

.progress-bar-bg {
  height: 8px;
  background: var(--bg-secondary);
  border-radius: 4px;
  overflow: hidden;
}

.progress-bar-fill {
  height: 100%;
  border-radius: 4px;
  transition: width 0.5s ease;
}

.progress-bar-fill.profit {
  background: linear-gradient(90deg, var(--profit), #059669);
}

.progress-bar-fill.loss {
  background: linear-gradient(90deg, var(--loss), #dc2626);
}

.progress-bar-fill.target {
  background: linear-gradient(90deg, var(--warning), #f97316);
}

.progress-target {
  font-size: 11px;
  color: var(--text-muted);
  margin-top: 6px;
  text-align: center;
}

/* DTE BADGE */
.dte-badge {
  position: absolute;
  top: 16px;
  right: 16px;
  background: var(--bg-secondary);
  border: 1px solid var(--border);
  padding: 4px 10px;
  border-radius: 12px;
  font-size: 11px;
  font-weight: 600;
  color: var(--text-secondary);
}

.dte-badge.urgent {
  background: rgba(245, 158, 11, 0.15);
  border-color: rgba(245, 158, 11, 0.3);
  color: var(--warning);
}

/* NEWS SECTION */
.news-section {
  margin-top: 28px;
}

.news-list {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.news-item {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 16px;
  text-decoration: none;
  color: inherit;
  transition: all 0.2s;
}

.news-item:hover {
  border-color: var(--accent);
}

.news-header {
  display: flex;
  gap: 8px;
  align-items: center;
  margin-bottom: 8px;
}

.news-symbol {
  font-size: 11px;
  font-weight: 700;
  padding: 3px 8px;
  border-radius: 6px;
  background: rgba(99, 102, 241, 0.15);
  color: var(--accent);
}

.news-source {
  font-size: 11px;
  color: var(--text-muted);
}

.news-headline {
  font-size: 14px;
  font-weight: 600;
  line-height: 1.4;
  margin-bottom: 6px;
}

.news-time {
  font-size: 11px;
  color: var(--text-muted);
}

/* STATUS BAR */
.status-bar {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: rgba(18, 18, 26, 0.98);
  backdrop-filter: blur(20px);
  border-top: 1px solid var(--border);
  padding: 14px 16px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 12px;
  z-index: 100;
}

.status-live {
  color: var(--profit);
  display: flex;
  align-items: center;
  gap: 8px;
  font-weight: 600;
}

.status-live::before {
  content: '';
  width: 8px;
  height: 8px;
  background: var(--profit);
  border-radius: 50%;
  animation: pulse 2s infinite;
}

@keyframes pulse {
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: 0.5; transform: scale(0.9); }
}

/* EMPTY STATE */
.empty {
  text-align: center;
  padding: 60px 20px;
  color: var(--text-secondary);
}

.empty-icon {
  font-size: 48px;
  margin-bottom: 16px;
  opacity: 0.5;
}

/* UTILITIES */
.hidden { display: none !important; }

/* MARKET STATUS */
.market-status {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 13px;
  color: var(--text-secondary);
}

.market-status.open {
  color: var(--profit);
}

.market-status.closed {
  color: var(--text-muted);
}
</style>
</head>
<body>
<nav>
  <div class="nav-inner">
    <div class="brand">
      <div class="brand-icon">WW</div>
      <span>White Wolf</span>
    </div>
    <div class="nav-links">
      <a href="index.html" class="active">Dashboard</a>
      <a href="wave-analysis.html">Waves</a>
      <a href="news.html">Intel</a>
      <a href="trades.html">Trades</a>
    </div>
  </div>
</nav>

<div class="container">
  <!-- HERO -->
  <div class="hero">
    <div class="hero-label">Total Fund Value</div>
    <div class="hero-value" id="fund-value">$--</div>
    <div class="hero-change" id="fund-change">
      <span id="pnl-amount">--</span>
      <span id="pnl-percent">(--%)</span>
    </div>
  </div>

  <!-- STATS ROW -->
  <div class="stats-row">
    <div class="stat-item">
      <div class="stat-label">Cash</div>
      <div class="stat-value" id="cash-value">$--</div>
    </div>
    <div class="stat-item">
      <div class="stat-label">Committed</div>
      <div class="stat-value" id="committed-value">$--</div>
    </div>
    <div class="stat-item">
      <div class="stat-label">P&L</div>
      <div class="stat-value" id="pnl-value">$--</div>
    </div>
  </div>

  <!-- POSITIONS SECTION -->
  <div class="section-header">
    <div>
      <div class="section-title">Active Positions</div>
      <div class="section-subtitle" id="positions-subtitle">-- open trades</div>
    </div>
    <div class="market-status" id="market-status">
      <span>●</span>
      <span id="market-text">Checking...</span>
    </div>
  </div>

  <div id="positions-list">
    <div class="empty">
      <div class="empty-icon">📊</div>
      Loading positions...
    </div>
  </div>

  <!-- NEWS SECTION -->
  <div class="news-section">
    <div class="section-header">
      <div>
        <div class="section-title">Market Intelligence</div>
        <div class="section-subtitle">Position-relevant news</div>
      </div>
    </div>
    <div class="news-list" id="news-list">
      <div class="empty" style="padding: 30px;">
        <div class="empty-icon">📰</div>
        Loading news...
      </div>
    </div>
  </div>
</div>

<!-- STATUS BAR -->
<div class="status-bar">
  <span id="last-update">--</span>
  <span class="status-live">● Live</span>
</div>

<script>
// Formatters
function fmt(n) {
  if (n == null || isNaN(n)) return '$0';
  return '$' + n.toLocaleString('en-US', { minimumFractionDigits: 0, maximumFractionDigits: 0 });
}

function fmtDec(n) {
  if (n == null || isNaN(n)) return '$0.00';
  return '$' + n.toFixed(2);
}

function fmtPct(n) {
  if (n == null || isNaN(n)) return '0%';
  return (n >= 0 ? '+' : '') + n.toFixed(1) + '%';
}

// Check market status
function isMarketOpen() {
  const now = new Date();
  const tz = 'America/Chicago';
  const timeStr = now.toLocaleTimeString('en-US', { timeZone: tz, hour12: false, hour: '2-digit', minute: '2-digit' });
  const day = now.toLocaleDateString('en-US', { timeZone: tz, weekday: 'short' });
  
  if (day === 'Sat' || day === 'Sun') return false;
  return timeStr >= '08:30' && timeStr <= '15:30';
}

// Load all data
async function loadData() {
  try {
    const ts = Date.now();
    const [fundRes, newsRes] = await Promise.all([
      fetch('data/fund_state.json?cb=' + ts, { cache: 'no-store', headers: { 'Cache-Control': 'no-cache' } }),
      fetch('data/news.json?cb=' + ts, { cache: 'no-store', headers: { 'Cache-Control': 'no-cache' } })
    ]);
    
    const fundData = fundRes.ok ? await fundRes.json() : null;
    const newsData = newsRes.ok ? await newsRes.json() : null;
    
    updateHero(fundData);
    updateStats(fundData);
    updatePositions(fundData);
    updateNews(newsData, fundData);
    updateMarketStatus();
    
    document.getElementById('last-update').textContent = new Date().toLocaleTimeString('en-US', {
      timeZone: 'America/Chicago',
      hour12: false,
      hour: '2-digit',
      minute: '2-digit'
    }) + ' CST';
    
  } catch (e) {
    console.error('Load error:', e);
  }
}

function updateHero(data) {
  if (!data) return;
  
  const fund = data.current_value || 0;
  const starting = data.starting_capital || 1000000;
  const pnl = fund - starting;
  const pnlPct = (pnl / starting) * 100;
  
  document.getElementById('fund-value').textContent = fmt(fund);
  
  const changeEl = document.getElementById('fund-change');
  changeEl.className = 'hero-change ' + (pnl >= 0 ? 'profit' : 'loss');
  document.getElementById('pnl-amount').textContent = (pnl >= 0 ? '+' : '') + fmtDec(pnl);
  document.getElementById('pnl-percent').textContent = '(' + fmtPct(pnlPct) + ')';
}

function updateStats(data) {
  if (!data) return;
  
  document.getElementById('cash-value').textContent = fmt(data.cash_available || 0);
  document.getElementById('committed-value').textContent = fmt(data.cash_committed || 0);
  
  const pnlEl = document.getElementById('pnl-value');
  const unrealized = data.unrealized_pnl || 0;
  pnlEl.textContent = fmt(unrealized);
  pnlEl.className = 'stat-value ' + (unrealized >= 0 ? 'profit' : 'loss');
}

function updatePositions(data) {
  if (!data || !data.active_positions) {
    document.getElementById('positions-list').innerHTML = '<div class="empty"><div class="empty-icon">📭</div>No open positions</div>';
    return;
  }
  
  const positions = data.active_positions;
  document.getElementById('positions-subtitle').textContent = positions.length + ' open trade' + (positions.length !== 1 ? 's' : '');
  
  let html = '';
  positions.forEach(p => {
    const pnl = p.unrealized_pnl || 0;
    const pnlClass = pnl >= 0 ? 'profit' : 'loss';
    const profit50 = (p.entry_premium_total || 0) * 0.5;
    const progressPct = Math.min(100, Math.max(0, p.profit_pct || 0));
    const targetReached = progressPct >= 50;
    
    // Calculate DTE
    const expDate = new Date(p.expiration);
    const today = new Date();
    const dte = Math.ceil((expDate - today) / (1000 * 60 * 60 * 24));
    
    html += '<div class="position-card ' + pnlClass + '">';
    html += '<div class="dte-badge ' + (dte <= 3 ? 'urgent' : '') + '">' + dte + ' DTE</div>';
    
    // Header
    html += '<div class="position-header">';
    html += '<div class="position-symbol">';
    html += '<span class="symbol-badge">' + p.symbol + '</span>';
    html += '</div>';
    html += '<div class="position-meta">';
    html += '<div class="position-strike">$' + p.strike + ' Put</div>';
    html += '<div class="position-contracts">' + p.contracts + ' contracts</div>';
    html += '</div>';
    html += '</div>';
    
    // Premium Display - ALWAYS GREEN (it's money received)
    html += '<div class="premium-display">';
    html += '<div class="premium-label">Premium Collected</div>';
    html += '<div class="premium-value">' + fmt(p.entry_premium_total || 0) + '</div>';
    html += '</div>';
    
    // Metrics
    html += '<div class="metrics-grid">';
    html += '<div class="metric"><span class="metric-label">Buy-to-Close</span><span class="metric-value">' + fmt(p.current_buyback_cost || 0) + '</span></div>';
    html += '<div class="metric"><span class="metric-label">Net P&L</span><span class="metric-value ' + pnlClass + '">' + (pnl >= 0 ? '+' : '') + fmtDec(pnl) + '</span></div>';
    html += '<div class="metric"><span class="metric-label">Entry Price</span><span class="metric-value">$' + (p.entry_premium_per_share || 0).toFixed(2) + '</span></div>';
    html += '<div class="metric"><span class="metric-label">Current</span><span class="metric-value">$' + (p.current_option_price || 0).toFixed(2) + '</span></div>';
    html += '</div>';
    
    // Progress
    html += '<div class="progress-section">';
    html += '<div class="progress-header">';
    html += '<span class="progress-label">' + (targetReached ? '✓ 50% Target Reached' : 'Progress to 50% Target') + '</span>';
    html += '<span class="progress-value ' + pnlClass + '">' + progressPct.toFixed(0) + '%</span>';
    html += '</div>';
    html += '<div class="progress-bar-bg">';
    html += '<div class="progress-bar-fill ' + (targetReached ? 'target' : pnlClass) + '" style="width:' + progressPct + '%"></div>';
    html += '</div>';
    html += '<div class="progress-target">Target: ' + fmt(profit50) + ' profit</div>';
    html += '</div>';
    
    html += '</div>';
  });
  
  document.getElementById('positions-list').innerHTML = html;
}

function updateNews(newsData, fundData) {
  if (!newsData || !newsData.articles || newsData.articles.length === 0) {
    document.getElementById('news-list').innerHTML = '<div class="empty" style="padding:30px;"><div class="empty-icon">📰</div>No news available</div>';
    return;
  }
  
  // Get symbols from positions
  const positionSymbols = fundData?.active_positions?.map(p => p.symbol) || [];
  
  // Filter news for position symbols only
  let articles = newsData.articles.filter(a => positionSymbols.includes(a.symbol) || a.symbol === 'MARKET');
  
  // Max 5 items
  articles = articles.slice(0, 5);
  
  let html = '';
  articles.forEach(article => {
    const timeAgo = getTimeAgo(article.datetime);
    html += '<a href="' + (article.url || '#') + '" class="news-item" target="_blank">';
    html += '<div class="news-header">';
    html += '<span class="news-symbol">' + article.symbol + '</span>';
    html += '<span class="news-source">' + (article.source || 'News') + ' • ' + timeAgo + '</span>';
    html += '</div>';
    html += '<div class="news-headline">' + article.headline + '</div>';
    html += '</a>';
  });
  
  document.getElementById('news-list').innerHTML = html;
}

function getTimeAgo(timestamp) {
  if (!timestamp) return 'recent';
  const now = Date.now() / 1000;
  const diff = now - timestamp;
  
  if (diff < 3600) return Math.floor(diff / 60) + 'm ago';
  if (diff < 86400) return Math.floor(diff / 3600) + 'h ago';
  return Math.floor(diff / 86400) + 'd ago';
}

function updateMarketStatus() {
  const open = isMarketOpen();
  const el = document.getElementById('market-status');
  el.className = 'market-status ' + (open ? 'open' : 'closed');
  document.getElementById('market-text').textContent = open ? 'Market Open' : 'Market Closed';
}

// Initialize
document.addEventListener('DOMContentLoaded', () => {
  loadData();
  setInterval(loadData, 30000); // Refresh every 30s
});
</script>
</body>
</html>
