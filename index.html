<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>White Wolf Clan | Command Center</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
body{background:#0a0a0f;color:#e8e8f0;min-height:100vh;overflow-x:hidden;box-sizing:border-box}

/* App */
#app{max-width:100vw;overflow-x:hidden;box-sizing:border-box}

/* Navigation */
nav{background:#12121a;border-bottom:1px solid #2a2a3a;padding:12px 16px;position:sticky;top:0;z-index:100}
.navinner{max-width:100%;margin:0 auto;display:flex;justify-content:space-between;align-items:center}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px}
.brandicon{width:28px;height:28px;background:linear-gradient(135deg,#6366f1,#8b5cf6);border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:12px}
.navlinks{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;-ms-overflow-style:none}
.navlinks::-webkit-scrollbar{display:none}
.navlinks a{color:#8b8b9e;text-decoration:none;padding:8px 12px;border-radius:6px;font-size:13px;font-weight:500;white-space:nowrap}
.navlinks a:hover,.navlinks a.active{background:rgba(99,102,241,.15);color:#6366f1}

.container{padding:16px;padding-bottom:80px;max-width:100vw}

/* Header Card */
.header-card{background:linear-gradient(135deg,rgba(99,102,241,.1),rgba(139,92,246,.1));border:1px solid rgba(99,102,241,.3);border-radius:16px;padding:20px;margin-bottom:16px;text-align:center}
.header-date{font-size:12px;color:#8b8b9e;text-transform:uppercase;letter-spacing:1px;margin-bottom:4px}
.header-time{font-size:36px;font-weight:700;font-family:monospace;letter-spacing:-1px}
.header-tz{font-size:11px;color:#64748b;margin-top:4px}

/* Fund Card */
.fund-card{background:#12121a;border:1px solid #2a2a3a;border-radius:16px;padding:20px;margin-bottom:16px}
.fund-label{font-size:11px;color:#8b8b9e;text-transform:uppercase;letter-spacing:1px;margin-bottom:8px}
.fund-value{font-size:32px;font-weight:700;font-family:monospace;letter-spacing:-1px}
.fund-change{display:inline-flex;align-items:center;gap:6px;margin-top:8px;padding:6px 12px;border-radius:20px;font-size:13px;font-weight:600}
.fund-change.positive{background:rgba(16,185,129,.1);color:#10b981}
.fund-change.negative{background:rgba(239,68,68,.1);color:#ef4444}

/* Stats Grid */
.stats-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:16px}
.stat-card{background:#12121a;border:1px solid #2a2a3a;border-radius:12px;padding:16px}
.stat-label{font-size:11px;color:#8b8b9e;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:6px}
.stat-value{font-size:20px;font-weight:700;font-family:monospace}
.stat-value.green{color:#10b981}
.stat-value.red{color:#ef4444}
.stat-sub{font-size:11px;color:#64748b;margin-top:4px}

/* Section Header */
.section-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.section-title{font-size:14px;font-weight:600;color:#8b8b9e;text-transform:uppercase;letter-spacing:0.5px}
.section-link{color:#6366f1;font-size:13px;text-decoration:none}

/* Position Preview Cards - Match Positions Page */
.position-preview-card{background:#12121a;border:1px solid #2a2a3a;border-radius:16px;padding:16px;margin-bottom:12px}
.position-preview-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.position-preview-symbol{background:linear-gradient(135deg,#6366f1,#8b5cf6);padding:6px 12px;border-radius:8px;font-weight:700;font-size:14px}
.position-preview-expires{font-size:11px;color:#64748b}
.position-preview-strike{font-size:13px;color:#8b8b9e;margin-bottom:16px}
.position-preview-premium-big{text-align:center;padding:16px 0;border-top:1px solid #2a2a3a;border-bottom:1px solid #2a2a3a;margin-bottom:16px}
.position-preview-premium-label{font-size:10px;color:#8b8b9e;text-transform:uppercase;letter-spacing:1px;margin-bottom:4px}
.position-preview-premium-value{font-size:28px;font-weight:800;color:#10b981;font-family:monospace}
.position-preview-btc{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.position-preview-btc-label{font-size:12px;color:#8b8b9e}
.position-preview-btc-value{font-size:14px;font-weight:600;font-family:monospace}
.position-preview-net{display:flex;justify-content:space-between;align-items:center;padding-top:8px;border-top:1px solid #2a2a3a}
.position-preview-net-label{font-size:12px;color:#8b8b9e}
.position-preview-net-value{font-size:16px;font-weight:800;font-family:monospace}
.position-preview-net-value.positive{color:#10b981}
.position-preview-net-value.negative{color:#ef4444}

/* Line Chart */
.line-chart{background:#12121a;border:1px solid #2a2a3a;border-radius:16px;padding:16px;margin-bottom:16px;height:180px;position:relative}
.line-chart svg{width:100%;height:100%}
.line-chart-line{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.line-chart-area{fill-opacity:0.1}
.line-chart-dot{fill:#0a0a0f;stroke-width:2}
.line-chart-grid{stroke:#2a2a3a;stroke-width:1;stroke-dasharray:4 4}
.chart-label{font-size:9px;fill:#64748b;font-family:monospace}
.chart-y-label{alignment-baseline:middle}
.chart-x-label{text-anchor:middle}

/* Status Bar */
#statusbar{position:fixed;bottom:0;left:0;right:0;background:#12121a;border-top:1px solid #2a2a3a;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;font-size:11px;color:#64748b;z-index:100}
.status-live{color:#10b981;display:flex;align-items:center;gap:6px}
.status-live::before{content:'';width:6px;height:6px;background:#10b981;border-radius:50%;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}

/* Utility */
.empty{text-align:center;padding:40px 20px;color:#64748b;font-size:13px}
.positive{color:#10b981}
.negative{color:#ef4444}
</style>
</head>
<body>
<div id="app">
<nav><div class="navinner">
<div class="brand"><div class="brandicon">WW</div>White Wolf</div>
<div class="navlinks">
<a href="index.html" class="active">Dashboard</a>
<a href="positions.html">Positions</a>

<a href="news.html">Intel</a>
</div>
</div></nav>

<div class="container">
<!-- Time Header -->
<div class="header-card">
<div class="header-date" id="current-date">--</div>
<div class="header-time" id="current-time">--:--</div>
<div class="header-tz">America/Chicago (CST)</div>
</div>

<!-- Fund Overview -->
<div class="fund-card">
<div class="fund-label">Total Fund Value</div>
<div class="fund-value" id="fund">$--</div>
<div class="fund-change" id="pnl-badge"><span id="pnl">--</span> <span id="pnl-pct">(--%)</span></div>
</div>

<!-- Stats Grid -->
<div class="stats-grid">
<div class="stat-card">
<div class="stat-label">P&L YTD</div>
<div class="stat-value" id="ytd">--</div>
<div class="stat-sub" id="ytd-sub">+0.00%</div>
</div>
<div class="stat-card">
<div class="stat-label">Committed</div>
<div class="stat-value" id="committed">--</div>
<div class="stat-sub" id="committed-sub">0% deployed</div>
</div>
<div class="stat-card">
<div class="stat-label">Cash</div>
<div class="stat-value green" id="cash">--</div>
<div class="stat-sub" id="cash-sub">Available</div>
</div>
<div class="stat-card">
<div class="stat-label">Commissions</div>
<div class="stat-value" id="commission">--</div>
<div class="stat-sub" id="commission-sub">$0.35/contract</div>
</div>
</div>

<!-- Line Chart -->
<div class="section-header">
<span class="section-title">Performance</span>
</div>
<div class="line-chart" id="line-chart">
<svg viewBox="0 0 300 120" preserveAspectRatio="none">
<!-- Grid lines at 25%, 50%, 75% of chart height -->
<line x1="40" y1="35" x2="300" y2="35" class="line-chart-grid"/>
<line x1="40" y1="60" x2="300" y2="60" class="line-chart-grid"/>
<line x1="40" y1="85" x2="300" y2="85" class="line-chart-grid"/>
</svg>
</div>

<!-- Positions Preview -->
<div class="section-header">
<span class="section-title">Open Positions</span>
<a href="positions.html" class="section-link">View All →</a>
</div>
<div id="positions-preview">
<div class="empty">Loading positions...</div>
</div>
</div>

<div id="statusbar">
<span id="last-update">--</span>
<span class="status-live">Live</span>
</div>
</div>

<script>
function fmt(n){if(n==null||isNaN(n))return'$0';return'$'+n.toLocaleString('en-US',{minimumFractionDigits:0,maximumFractionDigits:0});}
function fmtDec(n){if(n==null||isNaN(n))return'$0.00';return '$'+n.toFixed(2);}

function updateDateTime(){
const now=new Date();
const dateOptions={timeZone:'America/Chicago',month:'short',day:'numeric',year:'numeric'};
const timeOptions={timeZone:'America/Chicago',hour12:false,hour:'2-digit',minute:'2-digit'};
document.getElementById('current-date').textContent=now.toLocaleDateString('en-US',dateOptions);
document.getElementById('current-time').textContent=now.toLocaleTimeString('en-US',timeOptions);
}

async function loadData(){
try{
const ts=Date.now();
const response=await fetch('data/fund_state.json?cb='+ts,{cache:'no-store',headers:{'Cache-Control':'no-cache'}});
if(!response.ok)throw new Error('HTTP '+response.status);
const data=await response.json();

const fund=data?.current_value;
const pnl=data?.realized_pnl||0;
const pnlPct=data?.roi_pct||0;
const ytd=data?.realized_pnl||0;
const ytdPct=data?.roi_pct||0;
const committed=data?.cash_committed||0;
const cash=data?.cash_available||0;
const positions=data?.active_positions||[];

if(fund!==undefined){
document.getElementById('fund').textContent=fmt(fund);
}

const pnlEl=document.getElementById('pnl');
const pnlBadge=document.getElementById('pnl-badge');
pnlEl.textContent=(pnl>=0?'+':'')+fmtDec(pnl);
pnlBadge.className='fund-change '+(pnl>=0?'positive':'negative');
document.getElementById('pnl-pct').textContent='('+(pnlPct>=0?'+':'')+pnlPct.toFixed(2)+'%)';

document.getElementById('ytd').textContent=(ytd>=0?'+':'')+fmt(ytd);
document.getElementById('ytd').className='stat-value '+(ytd>=0?'green':'red');
document.getElementById('ytd-sub').textContent=(ytdPct>=0?'+':'')+ytdPct.toFixed(2)+'%';

document.getElementById('committed').textContent=fmt(committed);
document.getElementById('committed-sub').textContent=fund?((committed/fund*100).toFixed(0)+'% deployed'):'0%';

document.getElementById('cash').textContent=fmt(cash);
document.getElementById('cash-sub').textContent=fund?((cash/fund*100).toFixed(0)+'% available'):'0%';

// Commission display
const commission=data?.total_commissions||0;
document.getElementById('commission').textContent=fmtDec(commission);

const container=document.getElementById('positions-preview');
if(positions.length===0){
container.innerHTML='<div class="empty">No open positions</div>';
}else{
let html='';
const displayPositions = positions.length > 3 ? positions.slice(0,3) : positions;
displayPositions.forEach(p=>{
const pnl=p.realized_pnl||0;
const pnlClass=pnl>=0?'positive':'negative';
const buybackCost=p.exit_premium_total||0;

html+='<div class="position-preview-card">';
// Header: Symbol + Expiry
html+='<div class="position-preview-header">';
html+='<span class="position-preview-symbol">'+p.symbol+'</span>';
html+='<span class="position-preview-expires">Expires '+p.expiration+'</span>';
html+='</div>';
// Strike
html+='<div class="position-preview-strike">'+p.contracts+' contracts @ $'+p.strike+' strike</div>';
// Big Premium
html+='<div class="position-preview-premium-big">';
html+='<div class="position-preview-premium-label">Premium Collected</div>';
html+='<div class="position-preview-premium-value">'+fmt(p.entry_premium_total||0)+'</div>';
html+='</div>';
// Buy-to-Close Cost
html+='<div class="position-preview-btc">';
html+='<span class="position-preview-btc-label">Buy-to-Close</span>';
html+='<span class="position-preview-btc-value">'+fmt(buybackCost)+'</span>';
html+='</div>';
// Net Profit
html+='<div class="position-preview-net">';
html+='<span class="position-preview-net-label">Margin Required</span>';
html+='<span class="position-preview-net-value">'+fmt(p.entry_margin_required||0)+'</span>';
html+='</div>';
html+='</div>';
});

// Show "View all" link if more than 3 positions
if(positions.length > 3){
    html+='<div style="text-align:center;margin-top:16px;padding:12px;background:#1a1a25;border-radius:12px;border:1px solid #2a2a3a;">';
    html+='<a href="positions.html" style="color:#6366f1;text-decoration:none;font-weight:600;">View all '+positions.length+' positions →</a>';
    html+='</div>';
}

container.innerHTML=html;
}

document.getElementById('last-update').textContent='Updated '+new Date().toLocaleTimeString('en-US',{timeZone:'America/Chicago',hour12:false,hour:'2-digit',minute:'2-digit'})+' CST';

const history=data?.history||[];
if(history.length>1){
renderLineChart(history);
}

}catch(e){
console.error('Load error:',e);
}
}

function renderLineChart(history){
const svg=document.querySelector('#line-chart svg');
const values=history.map(h=>h.value);
const min=Math.min(...values);
const max=Math.max(...values);
const range=max-min||1;

const width=300;
const height=120;
const paddingLeft=40;
const paddingBottom=20;
const paddingTop=10;
const chartWidth=width-paddingLeft;
const chartHeight=height-paddingBottom-paddingTop;

// Clear existing paths (keep grid)
const existingPaths=svg.querySelectorAll('path:not(.line-chart-grid), circle, text');
existingPaths.forEach(p=>p.remove());

// Y-axis labels (3 labels: min, mid, max)
for(let i=0;i<3;i++){
const value=min+(range*(1-i/2));
const y=height-paddingBottom-(i/2)*chartHeight;
const text=document.createElementNS('http://www.w3.org/2000/svg','text');
text.setAttribute('x',paddingLeft-6);
text.setAttribute('y',y);
text.setAttribute('class','chart-label chart-y-label');
text.setAttribute('text-anchor','end');
text.textContent=(value/1000000).toFixed(2)+'M';
svg.appendChild(text);
}

// X-axis labels (first, middle, last dates)
const datesToShow=[0,Math.floor((history.length-1)/2),history.length-1];
datesToShow.forEach(i=>{
if(i<history.length){
const x=paddingLeft+(i/(history.length-1))*chartWidth;
const date=new Date(history[i].date);
const label=date.toLocaleDateString('en-US',{month:'short',day:'numeric'});
const text=document.createElementNS('http://www.w3.org/2000/svg','text');
text.setAttribute('x',x);
text.setAttribute('y',height-4);
text.setAttribute('class','chart-label chart-x-label');
text.textContent=label;
svg.appendChild(text);
}
});

// Create line path
let pathD='';
let areaD='';

history.forEach((h,i)=>{
const x=paddingLeft+(i/(history.length-1))*chartWidth;
const y=height-paddingBottom-((h.value-min)/range)*chartHeight;
if(i===0){
pathD=`M ${x} ${y}`;
areaD=`M ${x} ${height-paddingBottom} L ${x} ${y}`;
}else{
pathD+=` L ${x} ${y}`;
areaD+=` L ${x} ${y}`;
}
});

areaD+=` L ${paddingLeft+chartWidth} ${height-paddingBottom} Z`;

const isPositive=values[values.length-1]>=values[0];
const strokeColor=isPositive?'#10b981':'#ef4444';
const fillColor=isPositive?'#10b981':'#ef4444';

const areaPath=document.createElementNS('http://www.w3.org/2000/svg','path');
areaPath.setAttribute('d',areaD);
areaPath.setAttribute('class','line-chart-area');
areaPath.setAttribute('fill',fillColor);

const linePath=document.createElementNS('http://www.w3.org/2000/svg','path');
linePath.setAttribute('d',pathD);
linePath.setAttribute('class','line-chart-line');
linePath.setAttribute('stroke',strokeColor);

const lastX=paddingLeft+chartWidth;
const lastY=height-paddingBottom-((values[values.length-1]-min)/range)*chartHeight;
const dot=document.createElementNS('http://www.w3.org/2000/svg','circle');
dot.setAttribute('cx',lastX);
dot.setAttribute('cy',lastY);
dot.setAttribute('r',4);
dot.setAttribute('class','line-chart-dot');
dot.setAttribute('stroke',strokeColor);

svg.appendChild(areaPath);
svg.appendChild(linePath);
svg.appendChild(dot);
}

function init(){
updateDateTime();
setInterval(updateDateTime,60000);
loadData();
setInterval(loadData,30000);
}

// Auto-init on load
document.addEventListener('DOMContentLoaded',init);
</script>
</body>
</html>
